# Deploy the drive-pricing Worker only after CI passed on that main commit.
#
# drive#499: a push to main used to deploy even when the same commit's CI was
# red (CI run 37254363049 failed, deploy 37254362979 on 2f62b7a succeeded).
# GitHub's `workflow_run` on CI's conclusion is the stock gate: the job runs
# only when CI on a main push succeeded, and it checks out the commit CI
# tested. It does not re-run CI. It builds, ships, checks the live Worker
# version and health, and rolls the Worker version back when that check fails.
#
# drive#132: the old caller pointed at nish3451/shared-workflows (archived).
# That reusable workflow had no deploy target for drive and waited on every
# check on the main SHA, so merging to main never shipped the site and the
# live drive-pricing Worker went stale. This is the plain deploy job 0509
# already runs, adapted to drive's `cf` CLI (`cloudflare.config.ts`).
name: Deploy production

# zizmor's dangerous-triggers flags workflow_run because a fork's PR run can
# reach secrets through it. This one is limited to CI on a main push (the job
# `if` below), and it checks out the commit CI tested, never PR code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}  # manual redeploy of main head

concurrency:
  group: deploy-production
  cancel-in-progress: false  # deploys queue, never cancel mid-flight

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    # A red, cancelled or skipped CI run never matches. `event == 'push'` keeps
    # a merge-queue or pull-request CI run from deploying.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, Linux, X64] # own VPS runners: hosted minutes ran out 2026-10-03 and hosted jobs are refused for billing
    # A job with an environment gets a GitHub Deployment and deployment_status
    # events for free. No `url` while the site has no public address.
    environment:
      name: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's GITHUB_SHA is the main tip when the event fired, not
          # the commit CI tested. Ship the tested commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Remember the live Worker version
        # The rollback target. The first deployment in the list is the one
        # serving traffic. D1 sits outside the Worker version, so a rollback
        # restores code only.
        id: live
        run: |
          vid=$(npx cf workers deployments list --worker drive-pricing --per-page 1 --quiet |
            node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")).deployments[0];process.stdout.write(d.versions.find((v)=>v.percentage===100)?.version_id??"")')
          test -n "$vid" || { echo "::error::no live Worker version at 100%"; exit 1; }
          echo "live Worker version: $vid"
          echo "version_id=$vid" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        # The databases live outside the Worker version, so their migrations
        # apply before the code that reads the new tables ships (drive #170,
        # #178). One directory per database, matching the bindings in
        # cloudflare.config.ts. `cf d1 migrations apply` takes the database
        # id; it rejects names and binding names.
        run: |
          npx cf d1 migrations apply 93c9f523-159c-4261-8541-d4c059906df3 --dir migrations/waitlist
          npx cf d1 migrations apply 0f636b57-4a2e-482a-bf40-8aa315e2403e --dir migrations/drive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker
        # `npm run build` (cf build) already wrote .cloudflare/output, so
        # --prebuilt uploads that output instead of building a second time.
        id: ship
        run: npx cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the site stayed private
        # The workers.dev address sits behind Cloudflare Access until drive
        # has a domain (cloudflare.config.ts). A stranger must get a redirect
        # to the Access sign-in, never the site. The redirect must go to our
        # own Access team host exactly, so a lookalike URL cannot pass
        # (drive #159).
        run: |
          out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://drive-pricing.nishant345.workers.dev/)
          echo "workers.dev answered: ${out%%\?*}"
          case "$out" in
            "302 https://nish345.cloudflareaccess.com/"*) ;;
            *) echo "::error::the site is reachable without the Access sign-in"; exit 1 ;;
          esac
      - name: Check the live Worker version and health
        # The new version must be the one serving, and /api/health must answer
        # {"ok":true}. Access answers a runner with a 302, so the health call
        # needs an Access service token (drive#520). Until that token is on
        # the production environment the health call is skipped with a
        # warning on the run, and the version check still gates.
        id: smoke
        run: |
          vid=$(npx cf workers deployments list --worker drive-pricing --per-page 1 --quiet |
            node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")).deployments[0];process.stdout.write(d.versions.find((v)=>v.percentage===100)?.version_id??"")')
          echo "live Worker version: $vid (before deploy: $PREVIOUS_VERSION)"
          test -n "$vid" && test "$vid" != "$PREVIOUS_VERSION" || { echo "::error::the new Worker version is not live"; exit 1; }
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "::warning::health not checked: no Access service token on the production environment (drive#520)"
            exit 0
          fi
          body=$(curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://drive-pricing.nishant345.workers.dev/api/health) || { echo "::error::/api/health did not answer 200"; exit 1; }
          printf '%s' "$body" | node -e 'if(JSON.parse(require("fs").readFileSync(0,"utf8")).ok!==true)process.exit(1)' ||
            { echo "::error::/api/health is not ok: $body"; exit 1; }
          echo "health ok"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIOUS_VERSION: ${{ steps.live.outputs.version_id }}
      - name: Roll back the Worker version
        # Stock Workers rollback: a new deployment of the previous version at
        # 100%. Runs when anything after the upload failed.
        if: failure() && steps.ship.outcome == 'success'
        run: |
          npx cf workers deployments create --worker drive-pricing --strategy percentage \
            --versions "[{\"version_id\":\"$PREVIOUS_VERSION\",\"percentage\":100}]"
          echo "::error::rolled drive-pricing back to $PREVIOUS_VERSION"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.live.outputs.version_id }}
