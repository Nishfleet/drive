# Trigger stub. The dispatch logic lives once in Nishfleet/fleet-ops; a
# workflow only fires on its own repo's events, so the triggers stay here.
name: agent-dispatch
on:
  issues:
    types: [labeled, closed, reopened]
  # A park: comment starts a miss review (fleet-ops#9211).
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to dispatch, overrides the sweep and its claim-PR append'
        required: false
        type: string
      task:
        description: 'miss-review to replay a miss on issue, orchestrate to hand a parked issue to the orchestrator, empty for a normal sweep'
        required: false
        type: string
  # The last five types feed fleet-ops' hold-risky job, which disarms, dequeues
  # and labels needs-coordinator any risky PR whose head sha has no
  # coordinator approval. It only calls the API and never checks out PR code.
  # Without them hold-risky never ran here (fleet-ops#9293). Same list as 0509.
  pull_request_target:
    types: [dequeued, auto_merge_disabled, closed, auto_merge_enabled, synchronize, labeled, opened, reopened]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Hourly, not 6-hourly: a restart that kills every builder at once sends
  # no event, and the sweep is what requeues those claims (fleet-ops#9063;
  # idle 01:37-05:20Z on 2026-10-02).
  schedule:
    - cron: '17 * * * *'
# One running and one pending run per PR and PR action; GitHub replaces the
# pending run, so a burst of pushes or labels cannot fan out. A new push
# cancels the run for the push before it, since only the latest head matters.
# A PR close and every other event get their own group and never queue (the
# callee owns the sweep's own group). The fallback is named apart from the
# callee's own per-run group: a caller and callee sharing one group deadlock.
concurrency:
  group: >-
    ${{ (github.event_name == 'pull_request_target' && github.event.action != 'closed') && format('agent-dispatch-pr-{0}-{1}-{2}', github.repository, github.event.pull_request.number, github.event.action) ||
    format('agent-dispatch-stub-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && github.event.action == 'synchronize' }}
jobs:
  dispatch:
    # Every pull_request_target action but closed (the callee's hold-risky,
    # ejected and PR sweeps use them) is dispatched only for a same-repo head,
    # so a fork's PR opening, pushing or being labelled starts nothing.
    if: >-
      github.event_name != 'pull_request_target' || github.event.action == 'closed' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: Nishfleet/fleet-ops/.github/workflows/agent-dispatch.yml@main # same ref runner group 3 enforces for agent.yml; a SHA pin here drifts from agent.yml@main and strands jobs (0509#5231)
    # contents: write is the ceiling for two fleet-ops jobs: hold-risky's
    # merge-queue dequeue and the close job's branch delete. fleet-ops writers
    # are drive writers; docs/security.md states that boundary (drive#581).
    permissions:
      issues: write
      pull-requests: write
      contents: write
      actions: read
      checks: read
      statuses: read
    with:
      issue: ${{ inputs.issue }}
      agent_mode: ${{ vars.AGENT_MODE }}
      task: ${{ inputs.task }}
