# GoReleaser config for the drive CLI (drive#105: one command installs the
# CLI and rclone together).
#
# Stock release tooling, no hand-written install script: the .deb and .rpm
# declare `Depends: rclone`, and the Homebrew formula in the tap declares a
# `rclone` dependency, so the package manager installs both in one command.
# A v* tag triggers it through installer/release.yml (drive#509). A worker
# token cannot add a file under .github/workflows (fleet-ops#105), so the
# coordinator copies that file there. Signing and notarize stay off until
# their secrets exist, so a pre-release tag still publishes GitHub release
# assets. The consumer commands are generated from this file
# (src/install-lines.js, test/packaging.test.mjs). On Linux they were run
# against the packages below, and the Homebrew one is pending the tap.
#
# What was searched before choosing this: rclone's own install docs
# (https://rclone.org/install/), the GoReleaser docs
# (https://goreleaser.com/customization/nfpm/, .../homebrew_formulas/) and
# Homebrew's formula-cookbook docs. Every one of those puts a single
# `brew install <tap>/<formula>`, `apt install ./x.deb` or `dnf install x.rpm`
# in front of a user, with the dependency resolved by the package manager, so
# no install script is written and none is needed.
#
# What was actually run against these packages (drive#105, 2026-10-03, commit
# 955827d): `goreleaser release --snapshot --clean --skip=publish`, then the
# Linux halves in clean containers -- `dpkg-deb -I` on the amd64 .deb shows
# `Depends: rclone`, `rpm -qp --requires` on the .rpm shows `rclone`, and
# `apt install ./drive_x.deb` / `dnf install ./drive_x.rpm` mounted the drive.
# The Homebrew half is NOT run yet: the tap repository below does not exist, so
# `brew install nish3451/tap/drive` still fails until a release creates it.
version: 2

project_name: drive

builds:
  - id: drive
    main: ./cmd/drive
    binary: drive
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: drive
    ids: [drive]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Checksum signatures. The release workflow passes `--skip=sign` when
# GPG_PRIVATE_KEY is unset, so a pre-release without a signing key still
# publishes. The block is the stock goreleaser GPG sign of checksums.txt.
signs:
  - artifacts: checksum
    cmd: gpg
    args:
      - "--batch"
      - "--yes"
      - "-u"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

# Cross-platform binary notarize (quill). Off until MACOS_SIGN_P12 is a real
# cert: an Apple developer account is a spend decision, and the workflow
# sets NOTARIZE=false when that secret is empty. goreleaser-pro is not used.
notarize:
  macos:
    - ids: [drive]
      enabled: '{{ eq .Env.NOTARIZE "true" }}'
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: false

release:
  prerelease: auto

# The Linux packages. `dependencies: [rclone]` is the whole of the one-command
# promise on Linux: `apt install ./drive_x.deb` (or `dnf install ./drive_x.rpm`)
# reaches back to the archive and installs rclone, the version `drive init`
# then checks, in the same command (drive#105).
nfpms:
  - id: drive
    package_name: drive
    ids: [drive]
    vendor: Nishfleet
    homepage: https://drive-pricing.nishant345.workers.dev
    maintainer: Nishfleet <support@nishant345.workers.dev>
    description: A Finder drive for people and their agents, mounted with stock rclone.
    license: Proprietary
    formats: [deb, rpm]
    dependencies:
      - rclone
    bindir: /usr/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/drive/README.md

# The macOS cask. GoReleaser pushes it to the tap on each release, and
# `brew install nish3451/tap/drive` resolves the `rclone` dependency the same
# way apt does on Linux. `homebrew_casks` replaced the deprecated `brews` block
# (https://goreleaser.com/deprecations#brews), and `goreleaser check` in CI
# fails on a deprecated key. The tap repository does not exist yet: creating a
# public repo is Nish's, so a release before that publishes the .deb/.rpm and
# archive and fails only this publish step.
homebrew_casks:
  - name: drive
    ids: [drive]
    repository:
      owner: nish3451
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # auto: skip the tap push on a pre-release, so proving the pipeline with
    # a v0.0.0-* tag does not need the tap repository to exist yet.
    skip_upload: auto
    directory: Casks
    homepage: https://drive-pricing.nishant345.workers.dev
    description: A Finder drive for people and their agents, mounted with stock rclone.
    license: Proprietary
    dependencies:
      - formula: rclone
    # The binaries are unsigned (signing costs money; drive#154), so macOS
    # quarantines a downloaded one. GoReleaser's documented hook lifts it.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/drive"]
          end

changelog:
  use: git
