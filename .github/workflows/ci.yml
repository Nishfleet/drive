name: CI

on:
  pull_request:
  # The main ruleset's merge queue runs `verify` and `go` on the merge group
  # (drive#499). Without this trigger the queue waits on checks that never come.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# One rclone for every job, downloaded once per runner and checked against the
# digest rclone publishes in the release's SHA256SUMS. The Windows workflow
# (windows-msi.yml) pins the same release; test/installer.test.mjs fails when
# the two drift apart. An upgrade is a visible diff of both lines.
env:
  PINNED_RCLONE_VERSION: v1.75.1
  PINNED_RCLONE_LINUX_AMD64_SHA256: 982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A step runs only when the files it tests changed (drive#660).
#
# The old shape ran every heavy step on every change: 71 Lighthouse runs, 81
# `go` jobs and 72 `verify` jobs in six hours on the own runners on
# 2026-10-05, most of them on changes that could not affect them (a doc edit
# still waited out 6.5 minutes of verify; a Go-only change still ran 71 s of
# Lighthouse). Each job now opens with one `git diff --name-only` against the
# merge base, and its heavy steps read that through an `if:`.
#
# Two things this deliberately is not. It is not a workflow-level `paths:`
# filter, and not a job-level one either: a skipped required check blocks the
# main merge queue (drive#499, drive#660), so both jobs always run and always
# report, and only the steps inside them skip. And it is not a whole-job
# skip: the cheap gates that answer "is this repository still sound" - the
# helper-script ban, gofmt, the pinned gitleaks scan - run on every change.
#
# On `merge_group` and on a push to main the changed-files step does not run,
# its outputs stay empty, and every `if:` below reads that as "run". Those
# are the runs a merge waits on, so they test everything.

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64] # own VPS runners: hosted minutes ran out 2026-10-03 and hosted jobs are refused for billing
    timeout-minutes: 25 # own runners share the VPS with 10 builders: verify ran 6.5 min idle, passed 10 min under load (2026-10-04)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          # No cache on own runners: npm's cache is already on this disk, and
          # the cache step zipped all 18 GB of it for 4.5 min per job (2026-10-05).
          package-manager-cache: false
      - name: No helper scripts
        run: test -z "$(git ls-files scripts bin tools ops '*.sh')"
      # The one diff the heavy steps below read (drive#660). The base SHA is
      # passed through the environment and never expanded into the script, so
      # a payload value cannot reach the shell as text.
      - name: What this pull request changed
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The list lives in the runner's temp directory, never in the
          # checkout, so a pull request cannot point it somewhere else with a
          # tracked symlink.
          list="$(mktemp "$RUNNER_TEMP/changed.XXXXXX")"
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
            git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            git diff --name-only --no-renames "$BASE_SHA" HEAD > "$list"
          else
            # The base commit is not in this checkout, so a diff of it proves
            # nothing. Write a name no pattern below classifies, which runs
            # every heavy step rather than none of them.
            echo "unknown-merge-base" > "$list"
          fi
          # What each heavy step tests. Each output starts false and any one
          # file that is its input turns it true, so a pull request that
          # touches both a page and the Go code runs both. A file the table
          # does not classify is a file every heavy step tests: a new input
          # cannot stop being tested by being forgotten here, which is the
          # failure mode of a blocklist. `.github/` is left unclassified on
          # purpose - a change to how CI runs changes how the suite runs, so
          # it runs the suite.
          #
          # A few Node tests read Go files (test/own-words.test.mjs walks
          # cmd/, test/packaging.test.mjs reads .goreleaser.yaml). A Go-only
          # pull request skips them here, and the merge group, which runs
          # everything, is where they still gate the merge.
          node=false
          site=false
          while IFS= read -r file; do
            case "$file" in
              # The Go CLI, its module pins and its release config: the `go`
              # job tests them, and no page is built from them.
              cmd/* | go.mod | go.sum | .goreleaser.yaml) ;;
              # src/render-docs.js opens exactly two files under docs/ at
              # build time, so those two stay Node inputs. Neither is a page
              # the Lighthouse run measures.
              docs/scoreboard.md | docs/benchmarks.md) node=true ;;
              # The docs project: a VitePress source the build reads and
              # test/docs.test.mjs asserts, but Lighthouse measures the six
              # pages in public/ and the built get-started.html, never a docs
              # page. The repo's own Markdown is read by
              # test/pr-gate.test.mjs and test/docs.test.mjs and is not a
              # built page.
              docs-site/* | AGENTS.md | README.md) node=true ;;
              # The rest of the authored docs: read by a person, opened by
              # nothing in the build or the tests.
              docs/*) ;;
              *)
                node=true
                site=true
                ;;
            esac
          done < "$list"
          {
            echo "node=$node"
            echo "site=$site"
          } >> "$GITHUB_OUTPUT"
          cat "$list"
      # rclone serves the S3 stand-in the two search and mount proofs need, so
      # it is installed only alongside the steps that run them.
      - if: steps.changed.outputs.node != 'false'
        run: npm ci
      # test/standin-search.test.mjs proves the issue's number - 100,000 real
      # files, a search under a second - over a local `rclone serve s3`, and it
      # skips itself where rclone is absent. Installing it here is what keeps
      # that proof on every PR rather than only on the host that built it.
      # The cache holds only the release zip, and the next step checks it
      # against the pinned digest before anything runs, so a poisoned entry
      # fails the job rather than reaching it.
      - if: steps.changed.outputs.node != 'false'
        name: Cache the rclone release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0  # zizmor: ignore[cache-poisoning]
        with:
          path: ${{ runner.temp }}/rclone-dl
          key: rclone-${{ env.PINNED_RCLONE_VERSION }}-linux-amd64-${{ env.PINNED_RCLONE_LINUX_AMD64_SHA256 }}
      - if: steps.changed.outputs.node != 'false'
        name: Install rclone (the stock tool the S3 stand-in serves)
        run: |
          zip="rclone-$PINNED_RCLONE_VERSION-linux-amd64.zip"
          mkdir -p "$RUNNER_TEMP/rclone-dl"
          cd "$RUNNER_TEMP/rclone-dl"
          test -f "$zip" || curl -fsSO "https://downloads.rclone.org/$PINNED_RCLONE_VERSION/$zip"
          echo "$PINNED_RCLONE_LINUX_AMD64_SHA256  $zip" | sha256sum -c -
          unzip -qo "$zip"
          # No sudo on the self-hosted runners, so install per job.
          install -D -m 0755 "rclone-$PINNED_RCLONE_VERSION-linux-amd64/rclone" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/rclone" version
      # web-speed (drive#225): the budgets in lighthouserc.json, on the pages
      # as they actually ship. `npm run build` writes the same static-asset
      # bundle the deploy uploads, so the numbers are the site's and not a
      # development server's. LHCI then serves that directory locally and
      # asserts every page against the budget: a page that gets worse fails
      # this job, which is what makes a budget a ratchet rather than a note.
      # Lowering a number in lighthouserc.json is how a speed win gets locked
      # in; raising one needs a measurement in the PR body.
      # LHCI runs in its own throwaway container, pinned by digest, not from
      # node_modules: @lhci/cli 0.15.1 is the newest release and its
      # dependency chain (tmp, inquirer, lighthouse, puppeteer) carries high
      # npm advisories with no fix (drive#581). The container sees only this
      # checkout and runs as the runner's own user, so its reports stay
      # removable. Chrome needs the larger /dev/shm, or the tab crashes.
      # Lighthouse measures the six pages as they ship, so it runs when a page,
      # the code that writes one or the build that emits them changed.
      - if: steps.changed.outputs.site != 'false'
        run: npm run build
      - if: steps.changed.outputs.site != 'false'
        name: Lighthouse CI (in a throwaway container)
        run: >-
          docker run --rm --shm-size=1g --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/w" -w /w
          patrickhulce/lhci-client:0.15.1@sha256:558210c5e422a7babaaa09c285b7469da3f00fac1a9880c37883c65d666a7fc9
          lhci autorun --collect.settings.chromeFlags="--no-sandbox --headless=new"
      - if: steps.changed.outputs.node != 'false'
        run: npm test
      - name: Secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.29.0@sha256:71d3ee5990f2176f763b438298453fc37e87b119122045e176ca9d44ff00b08b
        with:
          args: detect --source . --redact --no-banner

  # The drive CLI is Go; the stand-in mount proof needs rclone and FUSE.
  go:
    runs-on: [self-hosted, Linux, X64] # own VPS runners: hosted minutes ran out 2026-10-03 and hosted jobs are refused for billing
    timeout-minutes: 20 # go took 8 min under load on own runners (2026-10-04)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          # No cache on own runners: Go's build cache is already on this disk,
          # and saving it took 2 min per job (2026-10-05).
          cache: false
      # The one diff the heavy steps below read (drive#660). Same shape and the
      # same safety as the `verify` job's: it sits before every step that
      # reads it.
      - name: What this pull request changed
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The list lives in the runner's temp directory, never in the
          # checkout, so a pull request cannot point it somewhere else with a
          # tracked symlink.
          list="$(mktemp "$RUNNER_TEMP/changed.XXXXXX")"
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
            git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            git diff --name-only --no-renames "$BASE_SHA" HEAD > "$list"
          else
            echo "unknown-merge-base" > "$list"
          fi
          # Starts false, and any one Go input, CI change or unknown base turns it true,
          # so a pull request that touches only a page, a Worker or a doc
          # stops this job after gofmt.
          golang=false
          while IFS= read -r file; do
            case "$file" in
              cmd/* | go.mod | go.sum | .goreleaser.yaml | .github/* | unknown-merge-base) golang=true ;;
            esac
          done < "$list"
          echo "go=$golang" >> "$GITHUB_OUTPUT"
          cat "$list"
      # The cache holds only the release zip, and the next step checks it
      # against the pinned digest before anything runs, so a poisoned entry
      # fails the job rather than reaching it.
      - if: steps.changed.outputs.go != 'false'
        name: Cache the rclone release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0  # zizmor: ignore[cache-poisoning]
        with:
          path: ${{ runner.temp }}/rclone-dl
          key: rclone-${{ env.PINNED_RCLONE_VERSION }}-linux-amd64-${{ env.PINNED_RCLONE_LINUX_AMD64_SHA256 }}
      - if: steps.changed.outputs.go != 'false'
        name: Install rclone (the stock tool the mount drives)
        run: |
          zip="rclone-$PINNED_RCLONE_VERSION-linux-amd64.zip"
          mkdir -p "$RUNNER_TEMP/rclone-dl"
          cd "$RUNNER_TEMP/rclone-dl"
          test -f "$zip" || curl -fsSO "https://downloads.rclone.org/$PINNED_RCLONE_VERSION/$zip"
          echo "$PINNED_RCLONE_LINUX_AMD64_SHA256  $zip" | sha256sum -c -
          unzip -qo "$zip"
          # No sudo on the self-hosted runners, so install per job.
          install -D -m 0755 "rclone-$PINNED_RCLONE_VERSION-linux-amd64/rclone" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/rclone" version
      - name: No helper scripts
        run: test -z "$(git ls-files scripts bin tools ops '*.sh')"
      - name: Go code is gofmt-formatted
        run: |
          unformatted="$(gofmt -l cmd)"
          if [ -n "$unformatted" ]; then
            echo "gofmt -w these files:"
            echo "$unformatted"
            exit 1
          fi
      - if: steps.changed.outputs.go != 'false'
        run: go vet ./cmd/...
      - if: steps.changed.outputs.go != 'false'
        name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2025.1.1"
          install-go: false
      # The release config stays valid: goreleaser fails `check` on a
      # deprecated key, so a stale config shows up on the PR, not on a tag.
      - if: steps.changed.outputs.go != 'false'
        name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.2"
          args: check
      # A per-run path: the self-hosted runners share one /tmp.
      - if: steps.changed.outputs.go != 'false'
        run: go build -o "$RUNNER_TEMP/drive" ./cmd/drive
      # The Windows jobs run only by hand (windows-msi.yml, drive#486), so the
      # Windows code is still vetted and its tests compiled here, cross-built
      # from Linux, on every pull request that touches the Go code.
      - if: steps.changed.outputs.go != 'false'
        name: Windows code vets and its tests compile
        env:
          GOOS: windows
        run: |
          go vet ./cmd/...
          go test -c -o /dev/null ./cmd/drive/
      - if: steps.changed.outputs.go != 'false'
        name: Unit tests, with the race detector
        run: go test -race ./cmd/drive/ -short -v
      # The step-2 done-when proof: a 64 MiB file's first bytes stream back
      # before the whole object downloads, and a save survives stop/start with
      # the same checksum, against a local `rclone serve s3` stand-in.
      - if: steps.changed.outputs.go != 'false'
        name: Stand-in mount proof
        run: go test ./cmd/drive/ -run TestStandinMountProof -v -timeout 300s
      - if: steps.changed.outputs.go != 'false'
        name: Two-device conflict proof
        run: go test ./cmd/drive/ -run TestTwoDevicesKeepBothSaves -v -timeout 300s
