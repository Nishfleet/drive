name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64] # own VPS runners: hosted minutes ran out 2026-10-03 and hosted jobs are refused for billing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: No helper scripts
        run: test -z "$(git ls-files scripts bin tools ops '*.sh')"
      - run: npm ci
      # test/standin-search.test.mjs proves the issue's number - 100,000 real
      # files, a search under a second - over a local `rclone serve s3`, and it
      # skips itself where rclone is absent. Installing it here is what keeps
      # that proof on every PR rather than only on the host that built it.
      - name: Install rclone (the stock tool the S3 stand-in serves)
        run: |
          curl -sSO https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -qo rclone-current-linux-amd64.zip
          # No sudo on the self-hosted runners, so install per job.
          install -D -m 0755 rclone-*/rclone "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          rclone version
      # web-speed (drive#225): the budgets in lighthouserc.json, on the pages
      # as they actually ship. `npm run build` writes the same static-asset
      # bundle the deploy uploads, so the numbers are the site's and not a
      # development server's. LHCI then serves that directory locally and
      # asserts every page against the budget: a page that gets worse fails
      # this job, which is what makes a budget a ratchet rather than a note.
      # Lowering a number in lighthouserc.json is how a speed win gets locked
      # in; raising one needs a measurement in the PR body.
      - run: npm run build
      - run: npx lhci autorun
      - run: npm test
      - name: Secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.29.0@sha256:71d3ee5990f2176f763b438298453fc37e87b119122045e176ca9d44ff00b08b
        with:
          args: detect --source . --redact --no-banner

  # The drive CLI is Go; the stand-in mount proof needs rclone and FUSE.
  go:
    runs-on: [self-hosted, Linux, X64] # own VPS runners: hosted minutes ran out 2026-10-03 and hosted jobs are refused for billing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: true
      - name: Install rclone (the stock tool the mount drives)
        run: |
          curl -sSO https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -qo rclone-current-linux-amd64.zip
          # No sudo on the self-hosted runners, so install per job.
          install -D -m 0755 rclone-*/rclone "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          rclone version
      - name: No helper scripts
        run: test -z "$(git ls-files scripts bin tools ops '*.sh')"
      - run: go vet ./cmd/...
      - run: go build -o /tmp/drive ./cmd/drive
      - name: Unit tests
        run: go test ./cmd/drive/ -short -v
      # The step-2 done-when proof: a 64 MiB file's first bytes stream back
      # before the whole object downloads, and a save survives stop/start with
      # the same checksum, against a local `rclone serve s3` stand-in.
      - name: Stand-in mount proof
        run: go test ./cmd/drive/ -run TestStandinMountProof -v -timeout 300s
      - name: Two-device conflict proof
        run: go test ./cmd/drive/ -run TestTwoDevicesKeepBothSaves -v -timeout 300s

  # Windows (drive#153): the drive-letter mount through stock `rclone mount`
  # with WinFsp as the driver. The unit tests cover every Windows branch; the
  # proof mounts at the first free letter from D: up, writes a file through
  # the drive letter, reads it back, then unmounts.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: true
      # rclone and WinFsp are the two stock pieces the mount stands on. Both
      # are the vendor's own Windows builds, downloaded from the vendor's own
      # release, not a vendored copy.
      - name: Install rclone (the stock tool the mount drives)
        shell: pwsh
        run: |
          curl.exe -sSO https://downloads.rclone.org/rclone-current-windows-amd64.zip
          Expand-Archive -Path rclone-current-windows-amd64.zip -DestinationPath rclone
          $exe = Get-ChildItem -Path rclone -Recurse -Filter rclone.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $exe.FullName)
          & $exe.FullName version
      - name: Install WinFsp (the driver rclone mount needs on Windows)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/winfsp/winfsp/releases/latest
          $asset = $release.assets | Where-Object { $_.name -like '*.msi' } | Select-Object -First 1
          if (-not $asset) { throw 'the WinFsp release carries no .msi asset' }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile winfsp.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/i', 'winfsp.msi', '/qn'
          $bin = Join-Path ${env:ProgramFiles(x86)} 'WinFsp\bin'
          if (-not (Test-Path (Join-Path $bin 'winfsp-x64.dll'))) { throw 'WinFsp did not install its driver' }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - run: go vet ./cmd/...
      # Only the Windows-specific tests run here: about 60 other tests in
      # cmd/drive assume Unix file modes and paths and fail on Windows today.
      # Widening this to the whole suite is a separate Windows-port job.
      - name: Windows unit tests
        run: go test ./cmd/drive/ -short -v -run 'Windows|WinFsp|Schtasks|DriveLetter|MountedDir|LoginItemPresent'
      - name: Windows drive-letter mount proof
        env:
          DRIVE_DEBUG: "1"
        run: go test ./cmd/drive/ -run TestWindowsMountProof -v -timeout 300s
