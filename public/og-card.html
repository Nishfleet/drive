<!doctype html>
<html lang="en" class="drive">
<head>
  <meta charset="utf-8">
  <title>Storagebun — share card source</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="The 1200x630 share card, rendered from the pricing page's own palette and the one price config so a repriced product moves the card with the page.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/site.css">
  <style>
html,
body {
  width: 1200px;
  height: 630px;
}

p {
  margin: 0;
}

body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 96px;
}

.wordmark {
  font-size: 34px;
  margin-bottom: 28px;
}

.lead {
  font-size: 34px;
  line-height: 1.2;
  font-weight: 600;
}

.amount {
  display: block;
  font-family: var(--serif);
  font-size: 120px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.03em;
}

.unit {
  display: block;
  font-size: 44px;
  line-height: 1.15;
  margin-top: 6px;
}

.maximum {
  font-size: 32px;
  line-height: 1.3;
  color: var(--ink-soft);
  margin-top: 20px;
}

.free {
  font-size: 28px;
  line-height: 1.3;
  color: var(--accent);
  font-weight: 600;
  margin-top: 10px;
}
  </style>
</head>
<body>
  <span class="wordmark"><i aria-hidden="true"></i>Storagebun</span>
  <p class="lead">Add $10 or more.</p>
  <p class="amount">2¢</p>
  <p class="unit">per GB a month</p>
  <p class="maximum">Never more than $15 per TB.</p>
  <p class="free">No plans. Your balance never expires.</p>
</body>
</html>
