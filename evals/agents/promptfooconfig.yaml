# The agent eval (drive issue #222): can an agent use drive from its own docs
# and its own CLI?
#
# The suite is two things and nothing else:
#
#   1. a set of tasks, drawn from the docs' own examples and from this repo's
#      own issue bodies, in `tasks/train.yaml`;
#   2. a set of graders, one per task, that checks the end state of the
#      answer.
#
# The tool is promptfoo and the reason is in the README. This config changes
# shape only when a grader needs it to.

description: "Can an AI agent use drive from its own docs and CLI? (drive issue #222)"

prompts:
  - file://prompts/agent.md

providers:
  - id: openrouter:google/gemini-2.5-flash
    label: "the agent under test"
  - id: openrouter:anthropic/claude-3.5-sonnet
    label: "a stronger model at a higher effort, for the scaling check"

# Every test sees the same reading stack: drive's public docs, rendered by
# `npm run docs:render` from docs-site/*.md, and the drive command's own help
# text, which `test/evals.test.mjs` proves still matches cmd/drive/main.go.
defaultTest:
  vars:
    docs_index: file://../../docs-site/.rendered/index.md
    docs_quickstart: file://../../docs-site/.rendered/quickstart.md
    docs_how_it_works: file://../../docs-site/.rendered/how-it-works.md
    docs_agents: file://../../docs-site/.rendered/agents.md
    docs_pricing: file://../../docs-site/.rendered/pricing.md
    docs_limits: file://../../docs-site/.rendered/limits.md
    docs_security: file://../../docs-site/.rendered/security.md
    docs_changelog: file://../../docs-site/.rendered/changelog.md
    drive_help: file://context/drive-help.txt

tests: file://tasks/train.yaml
