# The stock tool the mount and the S3 stand-in stand on, installed from the
# vendor's release at the version and digest the caller's workflow env pins.
# It reads them from the environment a job's `env:` exports, never from a
# context, so the action itself holds no pin and cannot drift from it.
name: rclone
description: Install the pinned rclone release and put it on PATH
runs:
  using: composite
  steps:
    - name: Install the release
      shell: bash
      run: | # zizmor: ignore[github-env] the only PATH entry added is this job's own $RUNNER_TEMP/bin
        zip="rclone-$PINNED_RCLONE_VERSION-linux-amd64.zip"
        mkdir -p "$RUNNER_TEMP/rclone-dl" && cd "$RUNNER_TEMP/rclone-dl" || exit 1
        test -f "$zip" || curl -fsSO "https://downloads.rclone.org/$PINNED_RCLONE_VERSION/$zip"
        echo "$PINNED_RCLONE_LINUX_AMD64_SHA256  $zip" | sha256sum -c -
        unzip -qo "$zip"
        # No sudo on the self-hosted runners, so install per job.
        install -D -m 0755 "rclone-$PINNED_RCLONE_VERSION-linux-amd64/rclone" "$RUNNER_TEMP/bin/rclone"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/bin/rclone" version
