# Push to main deploys the drive-pricing Worker. Merging to main already
# requires the `verify` and `go` checks (the main ruleset), so this job does
# not re-run them: it builds, ships, and smokes the live health endpoint.
#
# drive#132: the old caller pointed at nish3451/shared-workflows (archived).
# That reusable workflow had no deploy target for drive and waited on every
# check on the main SHA, so merging to main never shipped the site and the
# live drive-pricing Worker went stale. This is the plain deploy job 0509
# already runs, adapted to drive's `cf` CLI (`cloudflare.config.ts`).
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual redeploy of main head

concurrency:
  group: deploy-production
  cancel-in-progress: false  # deploys queue, never cancel mid-flight

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # A job with an environment gets a GitHub Deployment and deployment_status
    # events for free; `url` is also the origin the smoke step curls.
    environment:
      name: production
      url: https://drive-pricing.nishant345.workers.dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy the Worker
        # `npm run build` (cf build) already wrote .cloudflare/output, so
        # --prebuilt uploads that output instead of building a second time.
        run: npx cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke the deployed Worker
        # A deploy that reports success while the site 503s is not a success:
        # /api/health answers {"ok":true} only when the Worker can reach its
        # D1, its assets and its rate limiter (src/health.js).
        run: curl -fsS --retry 20 --retry-all-errors https://drive-pricing.nishant345.workers.dev/api/health | grep -q '"ok":true'
