# A weekly SQL dump of every D1 database the deploy migrates, kept off
# Cloudflare (drive#1027).
#
# Time Travel covers the last 30 days, and the deploy records a restore-point
# bookmark only when a migration runs (deploy-production.yml). The weekly dump
# is the copy that survives everything else: a wrong restore, a deleted
# database, an account problem. It lands as an encrypted GitHub artifact on
# GitHub's storage, off the storage provider's and Cloudflare's accounts.
#
# The dumps are sealed with age before upload: anyone with read access to this
# public repository can download its workflow artifacts, so only the ciphertext
# leaves the runner. The recipient is the repository variable AGE_RECIPIENT,
# the backup key's public half and never a secret, and a run without it fails
# loud on purpose: a backup that quietly shipped plaintext, or quietly shipped
# nothing, is the invisibility drive#520 exists to end. The age release itself
# is digest-pinned (docs/security.md).
#
# The dump goes through the stock D1 export API (`output_format: "polling"`,
# Cloudflare's OpenAPI schema): the first call starts the dump, later calls
# poll with the returned `at_bookmark` until `status: "complete"` carries a
# `signed_url`, valid one hour. The pinned cf CLI has no d1 export command, so
# this is the stock REST call, not hand-rolled backup logic. The same call
# carries `dump_options.tables`, the explicit list of tables the dump may hold:
# the waitlist database exports whole and sends no such list, and the drive
# database sends one because its dump would otherwise carry a virtual table.
#
# The matrix is the stock shape for "try each database and let the one that
# fails fail on its own": GitHub runs one job per database, `fail-fast: false`
# keeps a refused database from cancelling the other, and each job uploads its
# own dump as its own artifact. So a new failure on either database shows up on
# that database's own job instead of as one more line in a run that was already
# red, and one green job is never read as "both databases are backed up".
#
# The drive database holds the FTS5 index on `file_index` (migration
# `0039_file_index_fts.sql`), and the export API refuses a dump that carries a
# virtual table. The refusal is a property of the dump options, not of the
# database: the same call takes the drive database when `dump_options.tables`
# names every table the dump may carry and leaves the index and its five shadow
# tables out (proven on the drive database itself, run 40759220057). So the
# drive job names them, and the index rides a restore through the migrations'
# replay and the nightly reconciler rather than through the dump, because it is
# derived data rebuilt from `file_index` (src/search.js reconcileIndex).
# test/d1-export.test.mjs derives that list from the migrations, so a migration
# that adds a table fails the test until the list grows, and fails too if a
# database the deploy migrates leaves the matrix.
#
# The drive database has no s3-compatible gateway, so its dump and its probe
# walk the same two steps the other backups do: the API holds the dump for one
# hour, and a dump nobody moved to R2 is a dump that expires. So both jobs fetch
# the signed URL straight off the API answer, encrypt locally, and hand
# Cloudflare the already-encrypted bytes. `age` is the stock tool
# (`docs/runbook.md`, The weekly backup); its release archive is fetched from
# `filippo.io/age/releases` over TLS, and the checksum beside it is the one
# published on that release page. Neither job gets a bucket token, because
# neither writes to a bucket.
#
# Secrets stay behind `environment: production` (drive#507; enforced by
# test/workflow-secrets.test.mjs). Retention 90 days keeps 13 weekly points.
name: D1 weekly backup

on:
  schedule:
    # Mondays 05:37 UTC, between the Worker's nightly trips (reconcile 04:00,
    # trash purge 05:00) and the week's start.
    - cron: "37 5 * * 1"
  workflow_dispatch: {} # a manual run for restore drills

concurrency:
  group: d1-export
  cancel-in-progress: false # a backup never kills a backup

permissions:
  contents: read

jobs:
  export:
    name: export ${{ matrix.database.name }}
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 20
    strategy:
      fail-fast: false # a database the API refuses costs the others nothing
      matrix:
        database:
          - { name: waitlist, id: 93c9f523-159c-4261-8541-d4c059906df3, tables: [] }
          # Every table the drive dump may carry. The export API refuses a dump
          # that holds a virtual table, and the FTS5 index on `file_index`
          # (migration 0039_file_index_fts.sql) is one, with five shadow tables
          # of its own, so those six stay out and the other forty ride. The
          # index is derived data: a restore replays the migrations and the
          # nightly reconciler rebuilds it (src/search.js reconcileIndex), so
          # the dump loses nothing the schema and `file_index` cannot rebuild.
          # test/d1-export.test.mjs derives this list from the migrations and
          # fails the moment one adds a table the dump does not carry.
          - { name: drive, id: 0f636b57-4a2e-482a-bf40-8aa315e2403e, tables: ["_cf_KV", "account", "accounts", "agent_caps", "balance_ledger", "billing_pushes", "branches", "d1_migrations", "daily_draws", "device_codes", "device_queue_reports", "device_tokens", "devices", "events_seen", "fair_use_decisions", "file_index", "file_index_staging", "file_versions", "known_bad_feed_state", "known_bad_hashes", "meter_account_rerolls", "meter_rollup_state", "nightly_sizes", "passkey", "prepaid_draw_marks", "rateLimit", "session", "shares", "signin_account_sends", "signin_address_sends", "signin_return", "team_members", "teams", "twoFactor", "upload_requests", "usage_minutes", "user", "verification", "webhook_deliveries", "webhook_endpoints"] }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
      DB_NAME: ${{ matrix.database.name }}
      DB_ID: ${{ matrix.database.id }}
      # The tables the dump may carry, as JSON. `tables: []` on the waitlist
      # database sends no `dump_options` at all, so nothing filters that dump.
      DB_TABLES: ${{ toJSON(matrix.database.tables) }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install age, pinned by digest (docs/security.md)
        env:
          AGE_VERSION: v1.3.2
          AGE_LINUX_AMD64_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          node -e 'const fs=require("fs");const [,url,out]=process.argv;(async()=>{const r=await fetch(url);if(!r.ok){console.error("download: HTTP "+r.status);process.exit(1);}fs.writeFileSync(out,Buffer.from(await r.arrayBuffer()));})()' "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz" "$RUNNER_TEMP/age.tar.gz"
          echo "$AGE_LINUX_AMD64_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/age-bin"
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP/age-bin" --strip-components=1 age/age
          test -x "$RUNNER_TEMP/age-bin/age"
      - name: Dump and seal ${{ matrix.database.name }}
        run: |
          test -n "$AGE_RECIPIENT" || { echo "::error::the age recipient is unset: set the repo variable AGE_RECIPIENT to the backup key's public key (docs/runbook.md, The weekly backup) — the backup refuses to ship plaintext dumps"; exit 1; }
          mkdir -p "$RUNNER_TEMP/d1-export"
          file="$RUNNER_TEMP/d1-export/$DB_NAME-$(date -u +%Y%m%d).sql"
          headers="$RUNNER_TEMP/d1-headers"
          trap 'rm -f "$headers"' EXIT
          (umask 077 && printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" > "$headers")
          bookmark="" url=""
          for attempt in $(seq 1 20); do
            echo "poll $attempt for $DB_NAME"
            body=$(node -e 'const tables=JSON.parse(process.env.DB_TABLES),bookmark=process.argv[1];process.stdout.write(JSON.stringify({output_format:"polling",...(bookmark?{current_bookmark:bookmark}:{}),...(tables.length?{dump_options:{tables}}:{})}))' "$bookmark")
            resp=$(curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors \
              -H "@$headers" -H 'content-type: application/json' -d "$body" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID/export") \
              || { echo "::error::$DB_NAME export: the API call failed"; exit 1; }
            state=$(printf '%s' "$resp" | node -e '
              const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
              if (r.success !== true) { console.error("api: " + (r.errors?.[0]?.message ?? "not success")); process.exit(1); }
              const t = r.result ?? {};
              if (t.status === "error") { console.error("export: " + (t.error ?? "failed")); process.exit(1); }
              process.stdout.write(t.status === "complete" ? "done " + (t.result?.signed_url ?? "") : "wait " + (t.at_bookmark ?? ""));
            ') || { echo "::error::$DB_NAME export: the API answer is not a valid export response"; exit 1; }
            case "$state" in
              done\ *) url="${state#done }"; break ;;
              wait\ *) bookmark="${state#wait }" ;;
              *) echo "::error::$DB_NAME export: unreadable poll state"; exit 1 ;;
            esac
            sleep 15
          done
          test -n "$url" || { echo "::error::$DB_NAME export: no download URL after 20 polls"; exit 1; }
          # The signed URL's dump is data, not code: it is written to
          # $RUNNER_TEMP and shipped as an artifact, never executed, and it
          # changes every run so no digest can be pinned. The runtime's own
          # fetch (TLS, no shell quoting) takes it instead of curl, which
          # test/workflow-downloads.test.mjs would read as an unpinned
          # executable download (drive#581's gate is about assets that run).
          node -e 'const fs=require("fs");(async()=>{const r=await fetch(process.argv[1]);if(!r.ok){console.error("download: HTTP "+r.status);process.exit(1);}fs.writeFileSync(process.argv[2],Buffer.from(await r.arrayBuffer()));})()' "$url" "$file" \
            || { echo "::error::$DB_NAME export: the dump download failed"; exit 1; }
          echo "exported $DB_NAME -> ${file##*/} ($(wc -c < "$file") bytes, sha256 $(sha256sum "$file" | cut -d' ' -f1))"
          # Sealed before anything ships: only the .age ciphertext reaches
          # the artifact, and the plaintext dies with the runner's temp.
          "$RUNNER_TEMP/age-bin/age" -r "$AGE_RECIPIENT" -o "$file.age" "$file" \
            || { echo "::error::$DB_NAME export: the age encryption failed"; exit 1; }
          rm -f "$file"
          sha256sum "$RUNNER_TEMP/d1-export/"*.sql.age
      - name: Upload the sealed dump off Cloudflare
        # A job whose dump failed never reaches this step, so a database the
        # export API refuses costs the other nothing: its own job is red and
        # the dump that was made still ships.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d1-backup-${{ matrix.database.name }}
          path: ${{ runner.temp }}/d1-export/*.sql.age
          retention-days: 90
          if-no-files-found: error
