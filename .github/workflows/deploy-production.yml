name: Deploy production
# Canonical fleet deploy-on-green caller — synced to every active repo by
# Nishfleet/fleet-ops repo-standards-sync. Do NOT customize this file in a
# consumer repo (the sync will overwrite it); per-repo settings live in
# .github/deploy-config.json (build_command, deploy_command, health_url,
# node_version). Repos with no deploy target self-skip green.
on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual redeploy of main head; the green gate still runs
permissions:
  contents: read
  checks: read
  actions: read
concurrency:
  group: deploy-production
  cancel-in-progress: false  # deploys queue, never cancel mid-flight
jobs:
  deploy:
    uses: nish3451/shared-workflows/.github/workflows/deploy-production.yml@v1
    # explicit map, not inherit — least privilege, semgrep-enforced
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
