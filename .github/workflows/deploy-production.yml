name: Deploy production

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}  # manual redeploy of main head

concurrency:
  group: deploy-production
  cancel-in-progress: false  # deploys queue, never cancel mid-flight

permissions:
  contents: read
  actions: read # the main-head step below reads CI's runs

jobs:
  # Deploy on merge after CI is green on main (drive#499); rolls back if the site opens before launch.
  deploy:
    name: deploy
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Ship only a CI-green main head
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test "$SHA" = "$head" || { echo "::error::$SHA is no longer main's head ($head)"; exit 1; }
          green=1
          [ "$GITHUB_EVENT_NAME" = "workflow_run" ] || green=$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --branch main --commit "$SHA" --status success --json databaseId --jq length)
          test "$green" -gt 0 || { echo "::error::CI has not passed on $SHA"; exit 1; }
          echo "shipping $SHA: main head, CI passed"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Ship only an agent score above the pass bar
        run: |
          latest=$(gh run list -R "$GITHUB_REPOSITORY" --workflow agent-eval.yml --branch main --limit 1 --json status,conclusion,createdAt --jq '.[0] // empty | "\(.status) \(.createdAt) \(.conclusion // "none")"')
          if [ -z "$latest" ]; then
            echo "::warning::no agent eval run has completed yet; the score gate is not armed"
          else
            read -r status created conclusion <<<"$latest"
            if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
              echo "::error::the newest agent eval run on main concluded $conclusion (a score under the pass bar, or a run that could not score); its run summary says which, and the release stops here (drive#526)"
              exit 1
            fi
            age_days=$(( ($(date +%s) - $(date -d "$created" +%s)) / 86400 ))
            if [ "$age_days" -gt 14 ]; then
              echo "::error::the newest agent eval run on main is $age_days days old; run agent-eval.yml by hand (workflow_dispatch) for a fresh score (drive#526)"
              exit 1
            fi
            echo "agent eval gate: newest run on main is $status/$conclusion"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DRIVE_CF_BEACON_TOKEN: ${{ vars.DRIVE_CF_BEACON_TOKEN }}
      - name: Warn when there is no sender (drive#522)
        run: |
          for worker in drive-pricing drive-api; do
            names=$(npx cf workers secrets list --worker "$worker" --quiet) || { echo "::error::could not list the secret names on $worker; the cf error is above"; exit 1; }
            missing=$(printf '%s' "$names" | node -e 'const s=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(["MAIL_FROM","BETTER_AUTH_URL"].filter((n)=>!s.some((x)=>x.name===n)).join(" "))') || { echo "::error::the secret list from $worker was not the JSON array this check reads"; exit 1; }
            [[ $missing == *MAIL_FROM* ]] && echo "::warning title=No sender address::MAIL_FROM is not set on $worker, so every customer email fails (close receipts, reminders, the welcome, sign-in links), and on the api Worker the sign-in mail throws on the empty sender (core/email-send.js). Set it per drive#667, or drive#1088 for the api Worker. This deploy goes on only because drive is pre-launch; drive#752 makes this a block before the first paying customer."
            [[ $missing == *BETTER_AUTH_URL* ]] && echo "::warning title=No sign-in address::BETTER_AUTH_URL is not set on $worker, so authFor returns no instance (core/auth.js) and every account route answers as signed out instead of failing loudly. Set it per drive#873. This deploy goes on only because drive is pre-launch; drive#752 makes this a block before the first paying customer."
            [ -n "$missing" ] || echo "MAIL_FROM and BETTER_AUTH_URL are set on $worker"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remember the live Worker version
        id: live
        run: |
          vid=$(npx cf workers deployments list --worker drive-pricing --per-page 1 --quiet |
            node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")).deployments[0];process.stdout.write(d.versions.find((v)=>v.percentage===100)?.version_id??"")')
          test -n "$vid" || { echo "::error::no live Worker version at 100%"; exit 1; }
          echo "live Worker version: $vid"
          echo "version_id=$vid" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Record the D1 restore point
        id: bookmark
        run: |
          headers="$RUNNER_TEMP/d1-headers"
          trap 'rm -f "$headers"' EXIT
          (umask 077 && printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" > "$headers")
          for pair in "waitlist 93c9f523-159c-4261-8541-d4c059906df3" "drive 0f636b57-4a2e-482a-bf40-8aa315e2403e"; do
            read -r name db <<<"$pair"
            json=$(curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors -H "@$headers" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db/time_travel/bookmark") \
              || { echo "::error::no restore point for $name: the bookmark request failed"; exit 1; }
            bm=$(printf '%s' "$json" | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));if(r.success!==true||typeof r.result?.bookmark!=="string"||!r.result.bookmark)process.exit(1);process.stdout.write(r.result.bookmark)') \
              || { echo "::error::no restore point for $name: the bookmark is missing in the API answer"; exit 1; }
            echo "restore point for $name (bookmark): $bm" | tee -a "$GITHUB_STEP_SUMMARY"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations
        run: |
          npx cf d1 migrations apply 93c9f523-159c-4261-8541-d4c059906df3 --dir migrations/waitlist
          npx cf d1 migrations apply 0f636b57-4a2e-482a-bf40-8aa315e2403e --dir migrations/drive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the api Worker
        run: npx cf deploy --prebuilt --worker drive-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker
        run: npx cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the site stayed private
        run: |
          out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://storagebun.com/)
          echo "storagebun.com answered: ${out%%\?*}"
          case "$out" in
            "302 https://nish345.cloudflareaccess.com/"* | "302 https://storagebun.cloudflareaccess.com/"*) ;;
            *) echo "::error::storagebun.com is reachable without the Access sign-in"; exit 1 ;;
          esac
          v1=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://storagebun.com/v1/health)
          echo "/v1/health answered: ${v1%%\?*}"
          case "$v1" in
            "302 https://nish345.cloudflareaccess.com/"* | "302 https://storagebun.cloudflareaccess.com/"*) ;;
            *) echo "::error::the api family is reachable without the Access sign-in"; exit 1 ;;
          esac
          for u in https://drive-pricing.nishant345.workers.dev/ https://drive-api.nishant345.workers.dev/v1/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u")
            echo "workers.dev answered: $code ($u)"
            case "$code" in 200 | 302) echo "::error::$u still answers on workers.dev"; exit 1 ;; esac
          done
      - name: Check the live Worker version and health
        id: smoke
        run: |
          vid=$(npx cf workers deployments list --worker drive-pricing --per-page 1 --quiet |
            node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")).deployments[0];process.stdout.write(d.versions.find((v)=>v.percentage===100)?.version_id??"")')
          echo "live Worker version: $vid (before deploy: $PREVIOUS_VERSION)"
          test -n "$vid" && test "$vid" != "$PREVIOUS_VERSION" || { echo "::error::the new Worker version is not live"; exit 1; }
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "::warning::health not checked: no Access service token on the production environment (drive#520)"
            exit 0
          fi
          headers="$RUNNER_TEMP/access-headers"
          trap 'rm -f "$headers"' EXIT
          (umask 077 && printf 'CF-Access-Client-Id: %s\nCF-Access-Client-Secret: %s\n' \
            "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > "$headers")
          body=$(curl -sS --fail --max-time 10 --retry 5 --retry-delay 5 --retry-all-errors -H "@$headers" \
            https://storagebun.com/api/health) || { echo "::error::/api/health did not answer 200"; exit 1; }
          printf '%s' "$body" | node -e 'if(JSON.parse(require("fs").readFileSync(0,"utf8")).ok!==true)process.exit(1)' ||
            { echo "::error::/api/health is not ok: $body"; exit 1; }
          echo "health ok"
          if printf '%s' "$body" | node -e 'process.exit(JSON.parse(require("fs").readFileSync(0,"utf8")).email==="not-ready"?0:1)'; then
            echo "::warning title=Email not ready::/api/health reports email not-ready: customer email fails until MAIL_FROM is set (drive#667, drive#752)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIOUS_VERSION: ${{ steps.live.outputs.version_id }}
      - name: Roll back the Worker version
        if: failure() && steps.live.outcome == 'success'
        run: |
          npx cf workers deployments create --worker drive-pricing --strategy percentage \
            --versions "[{\"version_id\":\"$PREVIOUS_VERSION\",\"percentage\":100}]"
          echo "::error::rolled drive-pricing back to $PREVIOUS_VERSION"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION: ${{ steps.live.outputs.version_id }}
