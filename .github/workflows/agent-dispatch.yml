# Trigger stub. The dispatch logic lives once in Nishfleet/fleet-ops; a
# workflow only fires on its own repo's events, so the triggers stay here.
name: agent-dispatch
on:
  issues:
    types: [labeled, closed, reopened]
  # A park: comment starts a miss review (fleet-ops#9211).
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to dispatch, overrides the sweep and its claim-PR append'
        required: false
        type: string
      task:
        description: 'miss-review to replay a miss on issue, orchestrate to hand a parked issue to the orchestrator, empty for a normal sweep'
        required: false
        type: string
  # The last five types feed fleet-ops' hold-risky job, which disarms, dequeues
  # and labels needs-coordinator any risky PR whose head sha has no
  # coordinator approval. It only calls the API and never checks out PR code.
  # Without them hold-risky never ran here (fleet-ops#9293). Same list as 0509.
  pull_request_target:
    types: [dequeued, auto_merge_disabled, closed, auto_merge_enabled, synchronize, labeled, opened, reopened]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Hourly, not 6-hourly: a restart that kills every builder at once sends
  # no event, and the sweep is what requeues those claims (fleet-ops#9063;
  # idle 01:37-05:20Z on 2026-10-02).
  schedule:
    - cron: '17 * * * *'
jobs:
  dispatch:
    uses: Nishfleet/fleet-ops/.github/workflows/agent-dispatch.yml@main # same ref runner group 3 enforces for agent.yml; a SHA pin here drifts from agent.yml@main and strands jobs (0509#5231)
    permissions:
      issues: write
      pull-requests: write
      contents: write
      actions: read
      checks: read
      statuses: read
    with:
      issue: ${{ inputs.issue }}
      agent_mode: ${{ vars.AGENT_MODE }}
      task: ${{ inputs.task }}
      runner: '["self-hosted","Linux","X64"]' # hosted minutes ran out 2026-10-03; sweep was refused for billing
