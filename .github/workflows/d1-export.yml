name: D1 weekly backup

on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch: {} # a manual run for restore drills

concurrency:
  group: d1-export
  cancel-in-progress: false # a backup never kills a backup

permissions:
  contents: read

jobs:
  # The only off-Cloudflare backup of drive's and four other products' databases (drive#520, fleet-ops#10594).
  export:
    name: export ${{ matrix.database.name }}
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 20
    strategy:
      fail-fast: false # a database the API refuses costs the others nothing
      matrix:
        database:
          - { name: waitlist, id: 93c9f523-159c-4261-8541-d4c059906df3 }
          - { name: drive, id: 0f636b57-4a2e-482a-bf40-8aa315e2403e, compatibility: sqlite3_cli_only }
          - { name: siterep_payments, id: ec176fc4-b4f2-44c0-a925-b36ec067cff5 }
          - { name: aiconverter, id: 376080eb-60f1-4bb8-aabb-06622acabb63 }
          - { name: "0509", id: 746c6e3d-782e-443a-82d6-28ca93a16294 }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
      DB_NAME: ${{ matrix.database.name }}
      DB_ID: ${{ matrix.database.id }}
      DUMP_COMPATIBILITY: ${{ matrix.database.compatibility }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - &age
        name: Install age, pinned by digest (docs/security.md)
        env:
          AGE_VERSION: v1.3.2
          AGE_LINUX_AMD64_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          node -e 'const fs=require("fs");const [,url,out]=process.argv;(async()=>{const r=await fetch(url);if(!r.ok){console.error("download: HTTP "+r.status);process.exit(1);}fs.writeFileSync(out,Buffer.from(await r.arrayBuffer()));})()' "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz" "$RUNNER_TEMP/age.tar.gz"
          echo "$AGE_LINUX_AMD64_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/age-bin"
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP/age-bin" --strip-components=1 age/age
          test -x "$RUNNER_TEMP/age-bin/age"
      - name: Dump and seal ${{ matrix.database.name }}
        run: |
          test -n "$AGE_RECIPIENT" || { echo "::error::the age recipient is unset: set the repo variable AGE_RECIPIENT to the backup key's public key (docs/runbook.md, The weekly backup) — the backup refuses to ship plaintext dumps"; exit 1; }
          mkdir -p "$RUNNER_TEMP/d1-export"; file="$RUNNER_TEMP/d1-export/$DB_NAME-$(date -u +%Y%m%d).sql"
          headers="$RUNNER_TEMP/d1-headers"; trap 'rm -f "$headers"' EXIT
          (umask 077 && printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" > "$headers")
          bookmark="" url="" options=""
          [ -n "$DUMP_COMPATIBILITY" ] && options=",\"dump_options\":{\"compatibility\":\"$DUMP_COMPATIBILITY\"}"
          for attempt in $(seq 1 20); do
            echo "poll $attempt for $DB_NAME"
            body="{\"output_format\":\"polling\"$options}"; [ -n "$bookmark" ] && body="{\"output_format\":\"polling\",\"current_bookmark\":\"$bookmark\"$options}"
            resp=$(curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors \
              -H "@$headers" -H 'content-type: application/json' -d "$body" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DB_ID/export") \
              || { echo "::error::$DB_NAME export: the API call failed"; exit 1; }
            state=$(printf '%s' "$resp" | node -e '
              const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
              if (r.success !== true) { console.error("api: " + (r.errors?.[0]?.message ?? "not success")); process.exit(1); }
              const t = r.result ?? {};
              if (t.status === "error") { console.error("export: " + (t.error ?? "failed")); process.exit(1); }
              process.stdout.write(t.status === "complete" ? "done " + (t.result?.signed_url ?? "") : "wait " + (t.at_bookmark ?? ""));
            ') || { echo "::error::$DB_NAME export: the API answer is not a valid export response"; exit 1; }
            case "$state" in
              done\ *) url="${state#done }"; break ;;
              wait\ *) bookmark="${state#wait }" ;;
              *) echo "::error::$DB_NAME export: unreadable poll state"; exit 1 ;;
            esac
            sleep 15
          done
          test -n "$url" || { echo "::error::$DB_NAME export: no download URL after 20 polls"; exit 1; }
          node -e 'const fs=require("fs");(async()=>{const r=await fetch(process.argv[1]);if(!r.ok){console.error("download: HTTP "+r.status);process.exit(1);}fs.writeFileSync(process.argv[2],Buffer.from(await r.arrayBuffer()));})()' "$url" "$file" \
            || { echo "::error::$DB_NAME export: the dump download failed"; exit 1; }
          echo "exported $DB_NAME -> ${file##*/} ($(wc -c < "$file") bytes, sha256 $(sha256sum "$file" | cut -d' ' -f1))"
          "$RUNNER_TEMP/age-bin/age" -r "$AGE_RECIPIENT" -o "$file.age" "$file" \
            || { echo "::error::$DB_NAME export: the age encryption failed"; exit 1; }
          rm -f "$file"
          sha256sum "$RUNNER_TEMP/d1-export/"*.sql.age
      - name: Upload the sealed dump off Cloudflare
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d1-backup-${{ matrix.database.name }}
          path: ${{ runner.temp }}/d1-export/*.sql.age
          retention-days: 90
          if-no-files-found: error

  # The restore drill (fleet-ops#10594): each sealed dump this run just made is
  # decrypted and loaded into a fresh SQLite file, so a backup that cannot come
  # back fails the run. The private key is the restore-drill environment's
  # secret, apart from the production one that holds the Cloudflare token.
  drill:
    name: restore ${{ matrix.database }}
    needs: export
    if: ${{ !cancelled() }} # one red export leg must not skip the other restores
    runs-on: ubuntu-latest
    environment:
      name: restore-drill
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        database: [waitlist, drive, siterep_payments, aiconverter, "0509"]
    env:
      DB_NAME: ${{ matrix.database }}
    steps:
      - *age
      - name: Download the sealed dump this run made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: d1-backup-${{ matrix.database }}
          path: ${{ runner.temp }}/drill
      - name: Decrypt, load and check ${{ matrix.database }}
        env:
          AGE_IDENTITY: ${{ secrets.AGE_IDENTITY }}
        run: |
          umask 077
          test -n "$AGE_IDENTITY" || { echo "::error::the age identity is unset: add the backup key's private half as the secret AGE_IDENTITY on the restore-drill environment (docs/runbook.md, The weekly backup)"; exit 1; }
          dump=$(find "$RUNNER_TEMP/drill" -name '*.sql.age')
          sql="$RUNNER_TEMP/drill/restore.sql" db="$RUNNER_TEMP/drill/restore.db"
          "$RUNNER_TEMP/age-bin/age" -d -i <(printf '%s\n' "$AGE_IDENTITY") -o "$sql" "$dump" \
            || { echo "::error::$DB_NAME restore: the dump does not decrypt with the backup key"; exit 1; }
          sqlite3 -bail "$db" < "$sql" \
            || { echo "::error::$DB_NAME restore: the dump does not load into SQLite"; exit 1; }
          test "$(sqlite3 "$db" 'PRAGMA integrity_check;')" = ok \
            || { echo "::error::$DB_NAME restore: integrity_check failed"; exit 1; }
          count=$(sqlite3 "$db" "SELECT 'SELECT 0' || group_concat(' + (SELECT count(*) FROM \"' || replace(name, '\"', '\"\"') || '\")', '') FROM sqlite_schema WHERE type = 'table' AND name NOT LIKE 'sqlite_%' AND sql NOT LIKE 'CREATE VIRTUAL TABLE%'")
          rows=$(sqlite3 "$db" "$count")
          test "$rows" -gt 0 \
            || { echo "::error::$DB_NAME restore: the dump loads, but every table is empty"; exit 1; }
          echo "$DB_NAME restored: integrity ok, $(sqlite3 "$db" "SELECT count(*) FROM sqlite_schema WHERE type = 'table'") tables, rows present"
