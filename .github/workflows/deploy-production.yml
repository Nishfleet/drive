# Push to main deploys the drive-pricing Worker. Merging to main already
# requires the `verify` and `go` checks (the main ruleset), so this job does
# not re-run them: it builds, ships, and smokes the live health endpoint.
#
# drive#132: the old caller pointed at nish3451/shared-workflows (archived).
# That reusable workflow had no deploy target for drive and waited on every
# check on the main SHA, so merging to main never shipped the site and the
# live drive-pricing Worker went stale. This is the plain deploy job 0509
# already runs, adapted to drive's `cf` CLI (`cloudflare.config.ts`).
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # manual redeploy of main head

concurrency:
  group: deploy-production
  cancel-in-progress: false  # deploys queue, never cancel mid-flight

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: [self-hosted, Linux, X64] # own VPS runners: hosted minutes ran out 2026-10-03 and hosted jobs are refused for billing
    # A job with an environment gets a GitHub Deployment and deployment_status
    # events for free. No `url` while the site has no public address.
    environment:
      name: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Variable, not a secret: the token is in every visitor's HTML
          # (src/analytics.js). An unset variable ships the pages with no
          # beacon, which is the switched-off case drive#246 kept.
          DRIVE_CF_BEACON_TOKEN: ${{ vars.DRIVE_CF_BEACON_TOKEN }}
      - name: Apply D1 migrations
        # The databases live outside the Worker version, so their migrations
        # apply before the code that reads the new tables ships (drive #170,
        # #178). One directory per database, matching the bindings in
        # cloudflare.config.ts. `cf d1 migrations apply` takes the database
        # id; it rejects names and binding names.
        run: |
          npx cf d1 migrations apply 93c9f523-159c-4261-8541-d4c059906df3 --dir migrations/waitlist
          npx cf d1 migrations apply 0f636b57-4a2e-482a-bf40-8aa315e2403e --dir migrations/drive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy the Worker
        # `npm run build` (cf build) already wrote .cloudflare/output, so
        # --prebuilt uploads that output instead of building a second time.
        run: npx cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the site stayed private
        # The workers.dev address sits behind Cloudflare Access until drive
        # has a domain (cloudflare.config.ts). A stranger must get a redirect
        # to the Access sign-in, never the site. The live health smoke
        # returns with the domain. The redirect must go to our own Access team
        # host exactly, so a lookalike URL cannot pass (drive #159).
        run: |
          out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://drive-pricing.nishant345.workers.dev/)
          echo "workers.dev answered: ${out%%\?*}"
          case "$out" in
            "302 https://nish345.cloudflareaccess.com/"*) ;;
            *) echo "::error::the site is reachable without the Access sign-in"; exit 1 ;;
          esac
