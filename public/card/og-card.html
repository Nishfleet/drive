<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The share card's source (drive issue #123). public/og.png is rendered from
     this file, so the next price change is an edit to the sentences below and a
     re-render, not a redraw. test/og-card.test.mjs reads these strings and
     fails CI when they drift from src/pricing.js (PRICE), the one price source,
     the way test/pricing-copy.test.mjs gates the page.

     The palette is the page's own: the custom properties below are copied from
     public/site.css and test/og-card.test.mjs fails when they drift from it.
     The file is self-contained (no <link>), so it renders the same from a
     file:// URL, a static server or a screenshot tool.

     Render (1200x630), from the repo root:
       npx playwright screenshot --viewport-size "1200,630" \
         "file://$PWD/public/card/og-card.html" public/og.png
-->
<title>Drive — share card source</title>
<style>
:root {
  --paper: #faf6ee;
  --ink: #21201c;
  --ink-soft: #56514a;
  --accent: #1f3a5f;
  --serif:
    ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans:
    ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* {
  box-sizing: border-box;
  margin: 0;
}
html,
body {
  width: 1200px;
  height: 630px;
}
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 96px;
}
.wordmark {
  font-family: var(--serif);
  font-size: 34px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: 28px;
}
.amount {
  display: block;
  font-family: var(--serif);
  font-size: 150px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.03em;
}
.unit {
  display: block;
  font-size: 44px;
  line-height: 1.15;
  margin-top: 6px;
}
.ceiling {
  font-size: 32px;
  line-height: 1.3;
  color: var(--ink-soft);
  margin-top: 30px;
}
.free {
  font-size: 32px;
  line-height: 1.3;
  color: var(--accent);
  font-weight: 600;
  margin-top: 10px;
}
</style>
</head>
<body>
<p class="wordmark">Drive</p>
<p class="amount">2¢</p>
<p class="unit">per GB, billed by the minute</p>
<p class="ceiling">Never more than $12 a TB, and $8 a TB once you pass 1.5 TB.</p>
<p class="free">$1 free every month, no card needed</p>
</body>
</html>
