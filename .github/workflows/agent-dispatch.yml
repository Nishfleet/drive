# Trigger stub for Nishfleet/fleet-ops' dispatch; its stub- group must not equal the callee's per-run group (deadlock).
name: agent-dispatch
on:
  issues:
    types: [labeled, closed, reopened]
  # A park: comment starts a miss review (fleet-ops#9211).
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue: {description: 'Issue number to dispatch, overrides the sweep and its claim-PR append', required: false, type: string}
      task: {description: 'miss-review to replay a miss on issue, orchestrate to hand a parked issue to the orchestrator, empty for a normal sweep', required: false, type: string}
  # The last five types feed fleet-ops' hold-risky job (API calls only, never checks out PR code; fleet-ops#9293).
  pull_request_target:
    types: [dequeued, auto_merge_disabled, closed, auto_merge_enabled, synchronize, labeled, opened, reopened]
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Hourly, not 6-hourly: a restart that kills every builder sends no event; the sweep requeues those claims (fleet-ops#9063).
  schedule:
    - cron: '17 * * * *'
concurrency:
  group: ${{ github.event_name == 'pull_request_target' && github.event.action != 'closed' && format('agent-dispatch-pr-{0}-{1}-{2}', github.repository, github.event.pull_request.number, github.event.action) || format('agent-dispatch-stub-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && github.event.action == 'synchronize' }}
permissions:
  contents: read
jobs:
  dispatch:
    if: github.event_name != 'pull_request_target' || github.event.action == 'closed' || github.event.pull_request.head.repo.full_name == github.repository
    uses: Nishfleet/fleet-ops/.github/workflows/agent-dispatch.yml@main # same ref runner group 3 enforces for agent.yml; a SHA pin here drifts from agent.yml@main and strands jobs (0509#5231)
    # contents: write is the ceiling for two fleet-ops jobs: hold-risky's
    # merge-queue dequeue and the close job's branch delete. fleet-ops writers
    # are drive writers; docs/security.md states that boundary (drive#581).
    permissions:
      issues: write
      pull-requests: write
      contents: write
      actions: read
      checks: read
      statuses: read
    with:
      issue: ${{ inputs.issue }}
      agent_mode: ${{ vars.AGENT_MODE }}
      task: ${{ inputs.task }}
