# Deploy on merge: runs after CI passes on a main push (drive#499), ships the tested commit, rolls back on a failed check.
name: Deploy production

on: # zizmor: ignore[dangerous-triggers] only CI on a main push reaches the job, and it checks out that commit
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - name: Ship only main's head (drive#1046)
        run: test "$SHA" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DRIVE_CF_BEACON_TOKEN: ${{ vars.DRIVE_CF_BEACON_TOKEN }}
      - name: Remember the live Worker version (the rollback target)
        id: live
        run: echo "version_id=$(npx cf workers deployments list --worker drive-pricing --per-page 1 --quiet | jq -er '.deployments[0].versions[] | select(.percentage == 100) | .version_id')" >> "$GITHUB_OUTPUT"
      - name: Apply D1 migrations (drive#170; Time Travel restores a bad one, docs/runbook.md)
        run: |
          npx cf d1 migrations apply 93c9f523-159c-4261-8541-d4c059906df3 --dir migrations/waitlist
          npx cf d1 migrations apply 0f636b57-4a2e-482a-bf40-8aa315e2403e --dir migrations/drive
      - name: Deploy the api Worker first, because the site's binding names it (drive#342)
        run: npx cf deploy --prebuilt --worker drive-api
      - name: Deploy the site Worker
        run: npx cf deploy --prebuilt
      - name: The site and the api stay behind Access, and nothing answers on workers.dev (drive#159, drive#342)
        run: |
          wall='^302 https://(nish345|storagebun)\.cloudflareaccess\.com/'
          for u in https://storagebun.com/ https://storagebun.com/v1/health; do
            [[ $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$u") =~ $wall ]]
          done
          for u in https://drive-pricing.nishant345.workers.dev/ https://drive-api.nishant345.workers.dev/v1/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u")
            [[ $code != 200 && $code != 302 ]]
          done
      - name: Roll back the site Worker (drive#520)
        if: failure() && steps.live.outputs.version_id != ''
        run: |
          npx cf workers deployments create --worker drive-pricing --strategy percentage \
            --versions "[{\"version_id\":\"$PREVIOUS\",\"percentage\":100}]"
        env:
          PREVIOUS: ${{ steps.live.outputs.version_id }}
