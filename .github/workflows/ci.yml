name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PINNED_RCLONE_VERSION: v1.75.1
  PINNED_RCLONE_LINUX_AMD64_SHA256: 982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # AGENTS.md PR gate: npm test, the helper-script ban, gitleaks (drive#621). Required check.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: No helper scripts
        run: test -z "$(git ls-files scripts bin tools ops '*.sh')"
      - run: npm ci
      - name: Install rclone (the S3 stand-in the tests drive)
        run: &rclone |
          zip="rclone-$PINNED_RCLONE_VERSION-linux-amd64.zip"
          cd "$RUNNER_TEMP"
          curl -fsSO "https://downloads.rclone.org/$PINNED_RCLONE_VERSION/$zip"
          echo "$PINNED_RCLONE_LINUX_AMD64_SHA256  $zip" | sha256sum -c -
          unzip -qo "$zip"
          install -D -m 0755 "rclone-$PINNED_RCLONE_VERSION-linux-amd64/rclone" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm test

  # The drive CLI and its mount proofs (docs/build-spec.md step 1, drive#501, drive#868). Required check.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          go-version: "1.24"
          cache: true
      - name: Install rclone (the stock tool the mount drives)
        run: *rclone
      - name: Go code is gofmt-formatted
        run: test -z "$(gofmt -l cmd | tee /dev/stderr)"
      - run: go vet ./cmd/...
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2025.1.1"
          install-go: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.2"
          args: check
      - name: Windows code vets and its tests compile
        run: GOOS=windows go vet ./cmd/... && GOOS=windows go test -c -o /dev/null ./cmd/drive/
      - run: go test -race ./cmd/drive/ -short
      - run: go test ./cmd/drive/ -run 'TestStandinMountProof|TestTwoDevicesKeepBothSaves' -v -timeout 600s
      - name: No test fixture outlives its run (drive#868)
        run: node --test test/leftover-fixtures.test.mjs

  # Private infrastructure detail stays out of this public repo (fleet-ops#9528).
  private-detail-scan:
    name: Private detail scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - name: Scan the commits this pull request adds
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gl.tgz" | sha256sum -c - && tar -xzf gl.tgz gitleaks && rm gl.tgz
          ./gitleaks git . --config .github/gitleaks-private-detail.toml --log-opts "$RANGE" --redact --exit-code 2 --no-banner

  # The owner's last gate: a preview link on every PR (fleet-ops#10935), Cloudflare's own preview command.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - *checkout
      - *node
      - run: npm ci
      - run: npm run docs:build
      - name: Deploy the preview, and fail when Cloudflare gives no link
        run: |
          npx cf previews deploy "pr-$PR" | tee "$RUNNER_TEMP/preview.out"
          grep -m1 -oE 'https://pr-[0-9]+-[a-z0-9.-]+' "$RUNNER_TEMP/preview.out" >> "$GITHUB_STEP_SUMMARY"
        env:
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
