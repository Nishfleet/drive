# A weekly SQL dump of both D1 databases, kept off Cloudflare (drive#520).
#
# Time Travel covers the last 30 days, and the deploy records a restore-point
# bookmark only when a migration runs (deploy-production.yml). The weekly dump
# is the copy that survives everything else: a wrong restore, a deleted
# database, an account problem — it lands as a GitHub artifact on GitHub's
# storage, off the storage provider's and Cloudflare's accounts.
#
# The export goes through the stock D1 export API (`output_format: "polling"`,
# Cloudflare's OpenAPI schema): the first call starts the dump, later calls
# poll with the returned `at_bookmark` until `status: "complete"` carries a
# `signed_url`, valid one hour. The pinned `cf` CLI has no d1 export command,
# so this is the stock REST call, not hand-rolled backup logic.
#
# Secrets stay behind `environment: production` (drive#507; enforced by
# test/workflow-secrets.test.mjs). Retention 90 days keeps 13 weekly points.
name: D1 weekly backup

on:
  schedule:
    # Mondays 05:37 UTC, between the Worker's nightly trips (reconcile 04:00,
    # trash purge 05:00) and the week's start.
    - cron: "37 5 * * 1"
  workflow_dispatch: {} # a manual run for restore drills

concurrency:
  group: d1-export
  cancel-in-progress: false # a backup never kills a backup

permissions:
  contents: read

jobs:
  export:
    name: export
    runs-on: [self-hosted, Linux, X64] # own VPS runners: hosted minutes ran out 2026-10-03 and hosted jobs are refused for billing
    environment:
      name: production
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Export both databases
        run: |
          mkdir -p "$RUNNER_TEMP/d1-export"
          stamp=$(date -u +%Y%m%d)
          headers="$RUNNER_TEMP/d1-headers"
          trap 'rm -f "$headers"' EXIT
          (umask 077 && printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" > "$headers")
          for pair in "waitlist 93c9f523-159c-4261-8541-d4c059906df3" "drive 0f636b57-4a2e-482a-bf40-8aa315e2403e"; do
            read -r name db <<<"$pair"
            file="$RUNNER_TEMP/d1-export/$name-$stamp.sql"
            bookmark=""
            url=""
            for attempt in $(seq 1 20); do
              echo "poll $attempt for $name"
              if [ -n "$bookmark" ]; then
                body="{\"output_format\":\"polling\",\"current_bookmark\":\"$bookmark\"}"
              else
                body='{"output_format":"polling"}'
              fi
              resp=$(curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors \
                -H "@$headers" -H 'content-type: application/json' -d "$body" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db/export") \
                || { echo "::error::$name export: the API call failed"; exit 1; }
              state=$(printf '%s' "$resp" | node -e '
                const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
                if (r.success !== true) { console.error("api: " + (r.errors?.[0]?.message ?? "not success")); process.exit(1); }
                const t = r.result ?? {};
                if (t.status === "error") { console.error("export: " + (t.error ?? "failed")); process.exit(1); }
                if (t.status === "complete") { process.stdout.write("done " + (t.result?.signed_url ?? "")); }
                else { process.stdout.write("wait " + (t.at_bookmark ?? "")); }
              ') || { echo "::error::$name export: the API answer is not a valid export response"; exit 1; }
              case "$state" in
                done\ *) url="${state#done }"; break ;;
                wait\ *) bookmark="${state#wait }" ;;
                *) echo "::error::$name export: unreadable poll state"; exit 1 ;;
              esac
              sleep 15
            done
            test -n "$url" || { echo "::error::$name export: no download URL after 20 polls"; exit 1; }
            # The signed URL's dump is data, not code: it is written to
            # $RUNNER_TEMP and shipped as an artifact, never executed, and it
            # changes every run so no digest can be pinned. The runtime's own
            # fetch (TLS, no shell quoting) takes it instead of curl, which
            # test/workflow-downloads.test.mjs would read as an unpinned
            # executable download (drive#581's gate is about assets that run).
            node -e 'const fs=require("fs");(async()=>{const r=await fetch(process.argv[1]);if(!r.ok){console.error("download: HTTP "+r.status);process.exit(1);}fs.writeFileSync(process.argv[2],Buffer.from(await r.arrayBuffer()));})()' "$url" "$file" \
              || { echo "::error::$name export: the dump download failed"; exit 1; }
            echo "exported $name -> $name-$stamp.sql ($(wc -c < "$file") bytes)"
          done
          sha256sum "$RUNNER_TEMP/d1-export/"*.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload the dumps off Cloudflare
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d1-backup
          path: ${{ runner.temp }}/d1-export/*.sql
          retention-days: 90
          if-no-files-found: error
