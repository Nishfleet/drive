# Hand-run only: hosted Windows minutes are unpaid (drive#486); Windows MSI proof (drive#154).

name: Windows MSI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RCLONE_RELEASE: "v1.75.1"
  RCLONE_WINDOWS_AMD64_SHA256: "200eb602c126d82aa38b51e0f6b9ae837473ff99b51278d3f6f837574c494d6e"
  WINFSP_VERSION: "2.1.25156"
  WINFSP_MSI_URL: "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi"
  WINFSP_MSI_SHA256: "073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: true
      - name: Install rclone (the stock tool the mount drives)
        shell: pwsh
        run: |
          $zip = "rclone-$env:RCLONE_RELEASE-windows-amd64.zip"
          curl.exe -fsSO "https://downloads.rclone.org/$env:RCLONE_RELEASE/$zip"
          $got = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:RCLONE_WINDOWS_AMD64_SHA256) { throw "rclone's zip digest is $got, not the pinned one" }
          Expand-Archive -Path $zip -DestinationPath rclone
          $exe = Get-ChildItem -Path rclone -Recurse -Filter rclone.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $exe.FullName)
          & $exe.FullName version
      - name: Install WinFsp (the driver rclone mount needs on Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:WINFSP_MSI_URL -OutFile winfsp.msi
          $got = (Get-FileHash -Path winfsp.msi -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp's MSI digest is $got, not the pinned one" }
          Start-Process msiexec.exe -Wait -ArgumentList '/i', 'winfsp.msi', '/qn'
          $bin = Join-Path ${env:ProgramFiles(x86)} 'WinFsp\bin'
          if (-not (Test-Path (Join-Path $bin 'winfsp-x64.dll'))) { throw 'WinFsp did not install its driver' }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - run: go vet ./cmd/...
      - name: Windows unit tests
        run: go test ./cmd/drive/ -short -v -run 'Windows|WinFsp|Schtasks|DriveLetter|MountedDir|LoginItemPresent'
      - name: Windows drive-letter mount proof
        env:
          DRIVE_DEBUG: "1"
        run: go test ./cmd/drive/ -run TestWindowsMountProof -v -timeout 300s

  msi:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GO_VERSION: "1.24"
      INSTALL_DIR: 'C:\Program Files (x86)\Drive'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the WiX toolchain
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.1
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Restore the WiX extensions
        shell: pwsh
        run: |
          wix --version
          wix extension add -g WixToolset.Util.wixext/4.0.1 2>&1 | Write-Host
          Write-Host "Util add exit: $LASTEXITCODE"
          wix extension add -g WixToolset.Bal.wixext/4.0.1 2>&1 | Write-Host
          Write-Host "Bal add exit: $LASTEXITCODE"
          wix extension list -g 2>&1 | Write-Host
          Write-Host "list exit: $LASTEXITCODE"

      - name: Build drive.exe for Windows
        shell: pwsh
        run: go build -o installer\drive.exe ./cmd/drive

      - name: Download rclone (the vendor's own Windows build)
        shell: pwsh
        run: |
          $zip = "rclone-$env:RCLONE_RELEASE-windows-amd64.zip"
          curl.exe -fsSO "https://downloads.rclone.org/$env:RCLONE_RELEASE/$zip"
          $got = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:RCLONE_WINDOWS_AMD64_SHA256) { throw "rclone's zip digest is $got, not the pinned one" }
          Expand-Archive -Path $zip -DestinationPath rclone -Force
          $exe = Join-Path "rclone\rclone-$env:RCLONE_RELEASE-windows-amd64" "rclone.exe"
          if (-not (Test-Path $exe)) { throw "rclone.exe was not in the vendor's zip" }
          Copy-Item $exe installer\rclone.exe
          & $exe version

      - name: Download WinFsp's own MSI, and check its digest
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ env.WINFSP_MSI_URL }}" -OutFile installer\winfsp.msi
          $got = (Get-FileHash -Path installer\winfsp.msi -Algorithm SHA256).Hash.ToLower()
          if ($got -ne "${{ env.WINFSP_MSI_SHA256 }}") {
            throw "WinFsp's MSI digest is $got, not the pinned one"
          }
          Write-Host "winfsp.msi sha256: $got"

      - name: Build the Drive MSI
        shell: pwsh
        run: |
          wix build installer\drive.wxs -o installer\drive.msi `
            -bindpath installer `
            -ext WixToolset.Util.wixext `
            -arch x64
          if (-not (Test-Path installer\drive.msi)) { throw "the MSI did not build" }
          Write-Host "drive.msi: $((Get-Item installer\drive.msi).Length) bytes"

      - name: Build the Drive Setup bundle (Drive + WinFsp)
        shell: pwsh
        run: |
          wix build installer\bundle.wxs -o installer\drive-setup.exe -arch x64 `
            -bindpath installer `
            -ext WixToolset.Bal.wixext
          if (-not (Test-Path installer\drive-setup.exe)) { throw "the bundle did not build" }
          Write-Host "drive-setup.exe: $((Get-Item installer\drive-setup.exe).Length) bytes"

      - name: Install WinFsp (its own MSI, silent)
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "$PWD\installer\winfsp.msi", '/qn', '/norestart', '/l*v', "$PWD\installer\winfsp-install.log")
          if ($p.ExitCode -ne 0) { throw "WinFsp's MSI exited $($p.ExitCode)" }

      - name: Install Drive (silent, msiexec /qn)
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "$PWD\installer\drive.msi", '/qn', '/norestart', '/l*v', "$PWD\installer\install.log")
          if ($p.ExitCode -ne 0) { throw "the Drive MSI exited $($p.ExitCode)" }

      - name: Prove WinFsp is installed
        shell: pwsh
        run: |
          $bin = Join-Path ${env:ProgramFiles(x86)} "WinFsp\bin"
          $dll = Join-Path $bin "winfsp-x64.dll"
          if (-not (Test-Path $dll)) { throw "WinFsp did not install its driver at $dll" }
          Write-Host "WinFsp driver: $dll"

      - name: Prove drive.exe and rclone.exe are on PATH
        shell: pwsh
        run: |
          $drive = (Get-Command drive.exe -ErrorAction SilentlyContinue).Source
          $rclone = (Get-Command rclone.exe -ErrorAction SilentlyContinue).Source
          if (-not $drive) { throw "drive.exe is not on PATH"; exit 1 }
          if (-not $rclone) { throw "rclone.exe is not on PATH"; exit 1 }
          Write-Host "drive.exe: $drive"
          Write-Host "rclone.exe: $rclone"

      - name: Prove the login task from drive#153 exists
        shell: pwsh
        run: |
          $task = Get-ScheduledTask -TaskName "drive-mount" -ErrorAction SilentlyContinue
          if (-not $task) { throw "the login task drive-mount does not exist"; exit 1 }
          Write-Host "task: $($task.TaskName), state $($task.State)"

      - name: Prove the installed product mounts, writes and reads back
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "standin-data"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $serve = Start-Process rclone.exe -PassThru -ArgumentList `
            "serve", "s3", $data, "--auth-key", "MSIACCESSKEY,msisecret",
            "--addr", "127.0.0.1:39181", "--log-level", "INFO"
          Start-Sleep -Seconds 5
          try {
            $driveHome = "C:\Users\runneradmin"
            $env:DRIVE_S3_ACCESS_KEY_ID = "MSIACCESSKEY"
            $env:DRIVE_S3_SECRET_ACCESS_KEY = "msisecret"
            $out = & drive.exe mount --home $driveHome --endpoint http://127.0.0.1:39181 `
              --bucket drive-standin --prefix u/msi-test
            Write-Host "mount: $out"
            if ($LASTEXITCODE -ne 0) { throw "drive mount exited $LASTEXITCODE" }

            $status = & drive.exe status --home $driveHome
            Write-Host "status: $status"
            $letter = ($status | Select-String -Pattern "drive letter: ([A-Za-z]:)").Matches[0].Groups[1].Value
            if (-not $letter) { throw "no drive letter in drive status output"; exit 1 }
            Write-Host "mounted at $letter"

            $path = Join-Path (Join-Path $letter "\") "written-through.txt"
            Set-Content -Path $path -Value "written through the drive letter" -NoNewline
            Start-Sleep -Seconds 8
            $read = Get-Content -Path $path -Raw
            if ($read -ne "written through the drive letter") {
              throw "read back '$read', want 'written through the drive letter'"
            }
            Write-Host "write/read back: $read"

            & drive.exe unmount --home $driveHome
            if ($LASTEXITCODE -ne 0) { throw "drive unmount exited $LASTEXITCODE"; exit 1 }
            Start-Sleep -Seconds 3
            if (Test-Path $path) { throw "$letter is still mounted after unmount"; exit 1 }
            Write-Host "unmounted: $letter is gone"
          }
          finally {
            Stop-Process -Id $serve.Id -Force
          }

      - name: The winget manifest passes winget validate
        shell: pwsh
        run: |
          winget validate "installer\winget\manifests\Nishfleet\Nishfleet.Drive\1.0.0"
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed"; exit 1 }
          Write-Host "winget validate: passed"

      - name: Uninstall Drive (silent)
        shell: pwsh
        run: |
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/x', "$PWD\installer\drive.msi", '/qn', '/norestart', '/l*v', "$PWD\installer\uninstall.log")
          if ($p.ExitCode -ne 0) { throw "the Drive uninstall exited $($p.ExitCode)" }

      - name: Prove the uninstall is clean
        shell: pwsh
        run: |
          $fail = $false
          if (Test-Path "${{ env.INSTALL_DIR }}") {
            Write-Host "left behind: ${{ env.INSTALL_DIR }}"; $fail = $true
          }
          $task = Get-ScheduledTask -TaskName "drive-mount" -ErrorAction SilentlyContinue
          if ($task) { Write-Host "left behind: the drive-mount task"; $fail = $true }
          $path = [Environment]::GetEnvironmentVariable("PATH", "Machine")
          if ($path -split ';' -contains "${{ env.INSTALL_DIR }}") {
            Write-Host "left behind: the machine PATH entry"; $fail = $true
          }
          if ($fail) { exit 1 }
          Write-Host "uninstall clean: no install dir, no task, no PATH entry"

      - name: Prove WinFsp is its own package, and survived Drive's uninstall
        shell: pwsh
        run: |
          $dll = Join-Path ${env:ProgramFiles(x86)} "WinFsp\bin\winfsp-x64.dll"
          if (-not (Test-Path $dll)) {
            throw "WinFsp went with Drive, but WinFsp is its own package"
          }
          Write-Host "WinFsp is still installed: $dll"

      - name: Install through the bundle (the route winget install takes)
        shell: pwsh
        run: |
          $p = Start-Process installer\drive-setup.exe -Wait -PassThru -ArgumentList @('/quiet', '/norestart')
          if ($p.ExitCode -ne 0) { throw "drive-setup.exe exited $($p.ExitCode)" }

      - name: Prove the bundle installed Drive and its WinFsp payload
        shell: pwsh
        run: |
          $dll = Join-Path ${env:ProgramFiles(x86)} "WinFsp\bin\winfsp-x64.dll"
          if (-not (Test-Path $dll)) {
            throw "the bundle did not install the WinFsp payload it downloads"
          }
          if (-not (Test-Path "${{ env.INSTALL_DIR }}\drive.exe")) {
            throw "the bundle did not install drive.exe"
          }
          $drive = (Get-Command drive.exe -ErrorAction SilentlyContinue).Source
          if (-not $drive) { throw "the bundle did not put drive.exe on PATH" }
          $task = Get-ScheduledTask -TaskName "drive-mount" -ErrorAction SilentlyContinue
          if (-not $task) { throw "the bundle did not register the login task" }
          Write-Host "bundle installed: drive.exe $drive, WinFsp $dll, task drive-mount"

      - name: Uninstall through the bundle
        shell: pwsh
        run: |
          $p = Start-Process installer\drive-setup.exe -Wait -PassThru -ArgumentList @('/uninstall', '/quiet', '/norestart')
          if ($p.ExitCode -ne 0) { throw "the bundle uninstall exited $($p.ExitCode)" }

      - name: Prove the bundle uninstall is clean, WinFsp included
        shell: pwsh
        run: |
          $fail = $false
          if (Test-Path "${{ env.INSTALL_DIR }}") {
            Write-Host "left behind: ${{ env.INSTALL_DIR }}"; $fail = $true
          }
          $task = Get-ScheduledTask -TaskName "drive-mount" -ErrorAction SilentlyContinue
          if ($task) { Write-Host "left behind: the drive-mount task"; $fail = $true }
          $dll = Join-Path ${env:ProgramFiles(x86)} "WinFsp\bin\winfsp-x64.dll"
          if (Test-Path $dll) {
            Write-Host "left behind: WinFsp, which the chain owns"; $fail = $true
          }
          if ($fail) { exit 1 }
          Write-Host "bundle uninstall clean: no install dir, no task, no WinFsp"

      - name: Upload the installer's logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msi-install-logs
          path: |
            installer\install.log
            installer\winfsp-install.log
            installer\uninstall.log
          if-no-files-found: warn
