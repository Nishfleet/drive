name: CI

on:
  pull_request:
  # The main ruleset's merge queue runs `verify` and `go` on the merge group
  # (drive#499). Without this trigger the queue waits on checks that never come.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# One rclone for every job, downloaded once per runner and checked against the
# digest rclone publishes in the release's SHA256SUMS. The Windows workflow
# (windows-msi.yml) pins the same release; test/installer.test.mjs fails when
# the two drift apart. An upgrade is a visible diff of both lines.
env:
  PINNED_RCLONE_VERSION: v1.75.1
  PINNED_RCLONE_LINUX_AMD64_SHA256: 982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab
  # hyperfine is the CLI the speed ratchet proves a slowdown against
  # (test/speed-ratchet.test.mjs). Pinned like rclone: an upgrade is a visible
  # diff of both lines. drive#582: without this install the ratchet proof
  # skipped silently, because a runner service's PATH does not carry
  # ~/.local/bin where a login shell finds hyperfine.
  PINNED_HYPERFINE_VERSION: v1.21.0
  PINNED_HYPERFINE_LINUX_AMD64_SHA256: 60b70eb01e1a4dce1bf56a38393e1e2c2e79ed95a4ba711feb5c993f382604ab

# drive#582: a push to main is keyed per sha and never cancelled. The old
# group keyed every main push alike and cancelled in progress, so two merges
# inside one CI duration left the earlier commit with no verdict at all. A
# pull request's superseded run still cancels: only its own branch is waiting
# on it. A merge queue entry is keyed by the group's head sha for the same
# per-commit-verdict reason.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # drive#660: which jobs a pull request's files can affect, read by the
  # stock dorny/paths-filter from the PR's file list (the API, no checkout).
  # It runs only on pull_request. On merge_group and on a push to main it is
  # skipped, and every job below treats a `changes` that did not succeed as
  # "run everything", so the merge queue always runs the whole suite and a
  # mis-filed path costs a queue bounce, never a broken main.
  #
  # Skipping is job-level `if:`, never a workflow-level `paths:` filter: a job
  # skipped by `if:` reports success to the required `verify` and `go` checks,
  # while a workflow that never starts leaves them pending (drive#499).
  #
  # The `every` filters are negations: a file counts unless it is in a listed
  # area, so a path nobody classified runs the job. The `_extra` filters list
  # the files inside those areas that the job still reads.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node: ${{ steps.every.outputs.node }}
      site: ${{ steps.every.outputs.site }}
      go: ${{ steps.every.outputs.go }}
      node_extra: ${{ steps.some.outputs.node_extra }}
      site_extra: ${{ steps.some.outputs.site_extra }}
      go_extra: ${{ steps.some.outputs.go_extra }}
    steps:
      - id: every
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            # verify: everything except design and research notes.
            node:
              - '!docs/design/**'
              - '!docs/research/**'
            # npm run build + Lighthouse: the shipped static pages.
            site:
              - '!cmd/**'
              - '!test/**'
              - '!workers/**'
              - '!docs/**'
              - '!docs-site/**'
              - '!evals/**'
              - '!migrations/**'
              - '!installer/**'
              - '!bench/**'
              - '!go.mod'
              - '!go.sum'
              - '!**/*.md'
            # go: everything except the Node side.
            go:
              - '!src/**'
              - '!public/**'
              - '!workers/**'
              - '!test/**'
              - '!docs/**'
              - '!docs-site/**'
              - '!evals/**'
              - '!migrations/**'
              - '!installer/**'
              - '!package.json'
              - '!package-lock.json'
              - '!biome.json'
              - '!tsconfig.json'
              - '!vite.config.ts'
              - '!cloudflare.config.ts'
              - '!lighthouserc.json'
              - '!get-started.html'
              - '!.npmrc'
              - '!.nvmrc'
              - '!**/*.md'
      - id: some
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some
          filters: |
            # Read by test/site-styles and test/meter.
            node_extra:
              - docs/design/pricing-brief.md
              - docs/research/folder-moves.md
            # Rendered into the pages by src/docs.js and src/render-docs.js.
            site_extra:
              - docs/scoreboard.md
              - docs/benchmarks.md
              - cmd/drive/main.go
            # Read by the Go tests (os.ReadFile of ../../core).
            go_extra:
              - core/messages.js
              - core/seo.js
              - core/status.js
              - core/queues.js

  verify:
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.node == 'true' ||
       needs.changes.outputs.node_extra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25 # verify ran 6.5 min idle and 10 min under load on our own runners (2026-10-04), so keep headroom on hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: No helper scripts
        run: test -z "$(git ls-files scripts bin tools ops '*.sh')"
      - run: npm ci
      # test/standin-search.test.mjs proves the issue's number - 100,000 real
      # files, a search under a second - over a local `rclone serve s3`, and it
      # skips itself where rclone is absent. Installing it here is what keeps
      # that proof on every PR rather than only on the host that built it.
      # The cache holds only the release zip, and the next step checks it
      # against the pinned digest before anything runs, so a poisoned entry
      # fails the job rather than reaching it.
      - name: Cache the rclone release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rclone-dl
          key: rclone-${{ env.PINNED_RCLONE_VERSION }}-linux-amd64-${{ env.PINNED_RCLONE_LINUX_AMD64_SHA256 }}
      - name: Install rclone (the stock tool the S3 stand-in serves)
        run: |
          zip="rclone-$PINNED_RCLONE_VERSION-linux-amd64.zip"
          mkdir -p "$RUNNER_TEMP/rclone-dl"
          cd "$RUNNER_TEMP/rclone-dl"
          test -f "$zip" || curl -fsSO "https://downloads.rclone.org/$PINNED_RCLONE_VERSION/$zip"
          echo "$PINNED_RCLONE_LINUX_AMD64_SHA256  $zip" | sha256sum -c -
          unzip -qo "$zip"
          # No sudo on the self-hosted runners, so install per job.
          install -D -m 0755 "rclone-$PINNED_RCLONE_VERSION-linux-amd64/rclone" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/rclone" version
      # drive#582: speed-ratchet's proof against the real CLI skipped silently
      # wherever `which hyperfine` failed — and a runner service's PATH is not
      # a login shell's, so the install on this host was invisible to the job.
      # Same pattern as rclone: cached zip, digest checked before anything runs.
      - name: Cache the hyperfine release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hyperfine-dl
          key: hyperfine-${{ env.PINNED_HYPERFINE_VERSION }}-linux-amd64-${{ env.PINNED_HYPERFINE_LINUX_AMD64_SHA256 }}
      - name: Install hyperfine (the CLI the speed ratchet proves against)
        run: |
          tarball="hyperfine-$PINNED_HYPERFINE_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/hyperfine-dl"
          cd "$RUNNER_TEMP/hyperfine-dl"
          test -f "$tarball" || curl -fsSO "https://github.com/sharkdp/hyperfine/releases/download/$PINNED_HYPERFINE_VERSION/$tarball"
          echo "$PINNED_HYPERFINE_LINUX_AMD64_SHA256  $tarball" | sha256sum -c -
          tar xzf "$tarball"
          # No sudo on the self-hosted runners, so install per job.
          install -D -m 0755 "hyperfine-$PINNED_HYPERFINE_VERSION-x86_64-unknown-linux-gnu/hyperfine" "$RUNNER_TEMP/bin/hyperfine"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/hyperfine" --version
      # web-speed (drive#225): the budgets in lighthouserc.json, on the pages
      # as they actually ship. `npm run build` writes the same static-asset
      # bundle the deploy uploads, so the numbers are the site's and not a
      # development server's. LHCI then serves that directory locally and
      # asserts every page against the budget: a page that gets worse fails
      # this job, which is what makes a budget a ratchet rather than a note.
      # Lowering a number in lighthouserc.json is how a speed win gets locked
      # in; raising one needs a measurement in the PR body.
      # LHCI runs in its own throwaway container, pinned by digest, not from
      # node_modules: @lhci/cli 0.15.1 is the newest release and its
      # dependency chain (tmp, inquirer, lighthouse, puppeteer) carries high
      # npm advisories with no fix (drive#581). The container sees only this
      # checkout and runs as the runner's own user, so its reports stay
      # removable. Chrome needs the larger /dev/shm, or the tab crashes.
      - name: Build the site
        if: >-
          needs.changes.result != 'success' ||
          needs.changes.outputs.site == 'true' ||
          needs.changes.outputs.site_extra == 'true'
        run: npm run build
      - name: Lighthouse CI (in a throwaway container)
        if: >-
          needs.changes.result != 'success' ||
          needs.changes.outputs.site == 'true' ||
          needs.changes.outputs.site_extra == 'true'
        run: >-
          docker run --rm --shm-size=1g --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/w" -w /w
          patrickhulce/lhci-client:0.15.1@sha256:558210c5e422a7babaaa09c285b7469da3f00fac1a9880c37883c65d666a7fc9
          lhci autorun --collect.settings.chromeFlags="--no-sandbox --headless=new"
      # drive#759: the typecheck and the Biome check are a named step of
      # their own, beside `npm test` and not inside it.
      #
      # What this adds is the fail-fast, not the coverage. `pretest` is
      # `npm run check`, so `npm test` below already runs `tsc --noEmit`
      # (through `pretypecheck`, which regenerates `.cloudflare/types` from
      # cloudflare.config.ts) and then `biome check`, and both have gated
      # every merge since "Pro standards: type-check all JavaScript in CI"
      # (#125) landed pretest. What that wiring cannot give a reader of a
      # red run is which of the two turned it red: the pretest output sits
      # above the step it belongs to, so a Biome warning count reads as a
      # failing test run. One extra step costs about three seconds and names
      # both tools in the run log, where a type error is read as a type
      # error.
      #
      # No `if:` here, which is the same gate `npm test` below runs under:
      # the job-level `if:` on this `verify` job is the paths filter, so this
      # runs whenever the tests run.
      #
      # No `--write` and no `--fix`, ever: `biome check` reports and exits
      # non-zero, and the job must fail on the diff it was given rather than
      # fix it and push on.
      - name: Typecheck and Biome
        run: npm run check
      - run: npm test
        env:
          # drive#582: the named proofs write one line per skip here, so the
          # step after the suite can count them and fail on a proof this
          # runner had every tool to run. Unset locally, so a developer's
          # machine still skips honestly and silently.
          DRIVE_PROOF_REPORT: ${{ runner.temp }}/proof-skips.txt
      - name: Named proofs that skipped
        # drive#582: a skip used to be silent, so a proof the runner should be
        # able to run (its tool installed right here) could vanish from a green
        # run. The count is printed per named proof, and a proof whose tool is
        # on this runner — Chrome, a container engine, hyperfine — fails the
        # job instead of skipping.
        run: |
          report="$RUNNER_TEMP/proof-skips.txt"
          if [ ! -f "$report" ]; then
            echo "skips: 0 — no named proof skipped"
            exit 0
          fi
          echo "skips by named proof:"
          awk -F': ' '{ count[$1]++ } END { for (name in count) print "  " name ": " count[name] }' "$report"
          cat "$report"
          fail=0
          for proof in chrome-file-click s3-standin hyperfine-ratchet; do
            if grep -q "^$proof:" "$report"; then
              echo "::error::$proof skipped, but its tool (Chrome, a container engine, hyperfine) is installed on this runner above — a proof this runner should run must not skip (drive#582)"
              fail=1
            fi
          done
          exit "$fail"
      - name: Secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.29.0@sha256:71d3ee5990f2176f763b438298453fc37e87b119122045e176ca9d44ff00b08b
        with:
          args: detect --source . --redact --no-banner

  # The drive CLI is Go; the stand-in mount proof needs rclone and FUSE.
  go:
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.go == 'true' ||
       needs.changes.outputs.go_extra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20 # go took 8 min under load on our own runners (2026-10-04), so keep headroom on hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # goreleaser below runs `check` only and publishes nothing, so the Go
      # cache this job keeps never reaches a release artifact.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          go-version: "1.24"
          cache: true
      # The cache holds only the release zip, and the next step checks it
      # against the pinned digest before anything runs, so a poisoned entry
      # fails the job rather than reaching it.
      - name: Cache the rclone release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0  # zizmor: ignore[cache-poisoning]
        with:
          path: ${{ runner.temp }}/rclone-dl
          key: rclone-${{ env.PINNED_RCLONE_VERSION }}-linux-amd64-${{ env.PINNED_RCLONE_LINUX_AMD64_SHA256 }}
      - name: Install rclone (the stock tool the mount drives)
        run: |
          zip="rclone-$PINNED_RCLONE_VERSION-linux-amd64.zip"
          mkdir -p "$RUNNER_TEMP/rclone-dl"
          cd "$RUNNER_TEMP/rclone-dl"
          test -f "$zip" || curl -fsSO "https://downloads.rclone.org/$PINNED_RCLONE_VERSION/$zip"
          echo "$PINNED_RCLONE_LINUX_AMD64_SHA256  $zip" | sha256sum -c -
          unzip -qo "$zip"
          # No sudo on the self-hosted runners, so install per job.
          install -D -m 0755 "rclone-$PINNED_RCLONE_VERSION-linux-amd64/rclone" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/rclone" version
      - name: No helper scripts
        run: test -z "$(git ls-files scripts bin tools ops '*.sh')"
      - name: Go code is gofmt-formatted
        run: |
          unformatted="$(gofmt -l cmd)"
          if [ -n "$unformatted" ]; then
            echo "gofmt -w these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./cmd/...
      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2025.1.1"
          install-go: false
      # The release config stays valid: goreleaser fails `check` on a
      # deprecated key, so a stale config shows up on the PR, not on a tag.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.2"
          args: check
      # A per-run path: the self-hosted runners share one /tmp.
      - run: go build -o "$RUNNER_TEMP/drive" ./cmd/drive
      # The Windows jobs run only by hand (windows-msi.yml, drive#486), so the
      # Windows code is still vetted and its tests compiled here, cross-built
      # from Linux, on every PR.
      - name: Windows code vets and its tests compile
        env:
          GOOS: windows
        run: |
          go vet ./cmd/...
          go test -c -o /dev/null ./cmd/drive/
      - name: Unit tests, with the race detector
        run: |
          set -o pipefail
          go test -race ./cmd/drive/ -short -v 2>&1 | tee "$RUNNER_TEMP/go-unit.log"
          # drive#582: -short skips the slow proofs by design, and the two
          # named proofs run unshorted below. The count is printed so a run
          # never hides how much of the suite answered "skipped".
          skips=$(grep -c -- '--- SKIP:' "$RUNNER_TEMP/go-unit.log" || true)
          echo "unit -short skips: $skips (the named mount proofs run unshorted below)"
      # The step-2 done-when proof: a 64 MiB file's first bytes stream back
      # before the whole object downloads, and a save survives stop/start with
      # the same checksum, against a local `rclone serve s3` stand-in.
      # drive#582: these runners refuse every unprivileged FUSE mount
      # (fusermount3 "Operation not permitted", and AppArmor blocks
      # `unshare -Urm`), so the two mount proofs cannot run here yet; making
      # them run is drive#501. Until then a skip is printed as a count and a
      # ::warning::, never a silent green. pipefail keeps a failed `go test`
      # from hiding behind `tee`.
      - name: Stand-in mount proof
        run: |
          set -o pipefail
          go test ./cmd/drive/ -run TestStandinMountProof -v -count=1 -timeout 300s 2>&1 | tee "$RUNNER_TEMP/mount-proof.log"
          skips=$(grep -c -- '--- SKIP:' "$RUNNER_TEMP/mount-proof.log" || true)
          echo "TestStandinMountProof skips: $skips"
          if [ "$skips" -gt 0 ]; then
            echo "::warning::TestStandinMountProof skipped: this runner refuses an unprivileged FUSE mount (drive#501)"
          fi
      - name: Two-device conflict proof
        run: |
          set -o pipefail
          go test ./cmd/drive/ -run TestTwoDevicesKeepBothSaves -v -count=1 -timeout 300s 2>&1 | tee "$RUNNER_TEMP/conflict-proof.log"
          skips=$(grep -c -- '--- SKIP:' "$RUNNER_TEMP/conflict-proof.log" || true)
          echo "TestTwoDevicesKeepBothSaves skips: $skips"
          if [ "$skips" -gt 0 ]; then
            echo "::warning::TestTwoDevicesKeepBothSaves skipped: this runner refuses an unprivileged FUSE mount (drive#501)"
          fi
