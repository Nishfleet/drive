name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PINNED_RCLONE_VERSION: v1.75.1
  PINNED_RCLONE_LINUX_AMD64_SHA256: 982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # drive#660, drive#867: skip jobs a PR's files cannot affect; the merge queue runs all.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      node: ${{ steps.every.outputs.node }}
      site: ${{ steps.every.outputs.site }}
      go: ${{ steps.every.outputs.go }}
      node_extra: ${{ steps.some.outputs.node_extra }}
      site_extra: ${{ steps.some.outputs.site_extra }}
      go_extra: ${{ steps.some.outputs.go_extra }}
    steps:
      - id: every
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            node:
              - '!docs/design/**'
              - '!docs/research/**'
              - '!{cmd,internal}/**/*.go'
              - '!{go.mod,go.sum}'
            site:
              - '!{cmd,test,workers}/**'
              - '!{docs,docs-site}/**'
              - '!{evals,migrations,installer,bench}/**'
              - '!{internal,.github}/**'
              - '!{go.mod,go.sum}'
              - '!**/*.md'
            go:
              - '!{src,public,workers,test}/**'
              - '!{docs,docs-site}/**'
              - '!{evals,migrations,installer}/**'
              - '!.github/**'
              - '!{package.json,package-lock.json,biome.json,tsconfig.json}'
              - '!{vite.config.ts,cloudflare.config.ts,lighthouserc.json}'
              - '!{get-started.html,.npmrc,.nvmrc}'
              - '!**/*.md'
      - id: some
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some
          filters: |
            node_extra:
              - docs/design/pricing-brief.md
              - docs/research/folder-moves.md
              - cmd/drive/bench_test.go
              - cmd/drive/config.go
              - cmd/drive/e2e_test.go
              - cmd/drive/login.go
              - cmd/drive/logout_test.go
              - cmd/drive/main.go
              - cmd/drive/messages.go
              - cmd/drive/update.go
              - internal/login/config.go
            site_extra:
              - docs/scoreboard.md
              - docs/benchmarks.md
              - cmd/drive/main.go
            go_extra:
              - core/messages.js
              - core/seo.js
              - core/status.js
              - core/queues.js

  # AGENTS.md PR gate: npm test, helper-script ban, gitleaks (drive#621), Lighthouse budgets (drive#225).
  verify:
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.node == 'true' ||
       needs.changes.outputs.node_extra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25 # verify ran 6.5 min idle and 10 min under load on our own runners (2026-10-04), so keep headroom on hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No agent attribution in the PR's commits or body
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          log=$(git log --format=%B "$BASE_SHA..$HEAD_SHA")
          ! printf '%s\n%s\n' "$log" "$PR_BODY" | grep -iEn '^(co-authored-by|claude-session):|^[^[:alpha:]]*generated with'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: No helper scripts
        run: test -z "$(git ls-files scripts bin tools ops '*.sh')"
      - run: npm ci
      - name: Cache the rclone release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rclone-dl
          key: rclone-${{ env.PINNED_RCLONE_VERSION }}-linux-amd64-${{ env.PINNED_RCLONE_LINUX_AMD64_SHA256 }}
      - name: Install rclone (the stock tool the S3 stand-in serves)
        run: |
          zip="rclone-$PINNED_RCLONE_VERSION-linux-amd64.zip"
          mkdir -p "$RUNNER_TEMP/rclone-dl"
          cd "$RUNNER_TEMP/rclone-dl"
          test -f "$zip" || curl -fsSO "https://downloads.rclone.org/$PINNED_RCLONE_VERSION/$zip"
          echo "$PINNED_RCLONE_LINUX_AMD64_SHA256  $zip" | sha256sum -c -
          unzip -qo "$zip"
          install -D -m 0755 "rclone-$PINNED_RCLONE_VERSION-linux-amd64/rclone" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/rclone" version
      - name: Build the site
        if: >-
          needs.changes.result != 'success' ||
          needs.changes.outputs.site == 'true' ||
          needs.changes.outputs.site_extra == 'true'
        run: npm run build
      - name: Lighthouse CI (in a throwaway container)
        if: >-
          needs.changes.result != 'success' ||
          needs.changes.outputs.site == 'true' ||
          needs.changes.outputs.site_extra == 'true'
        run: >-
          docker run --rm --shm-size=1g --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/w" -w /w
          patrickhulce/lhci-client:0.15.1@sha256:558210c5e422a7babaaa09c285b7469da3f00fac1a9880c37883c65d666a7fc9
          lhci autorun --collect.settings.chromeFlags="--no-sandbox --headless=new"
      - name: Typecheck and Biome
        run: npm run check
      - run: npm test
      - name: Secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.29.0@sha256:71d3ee5990f2176f763b438298453fc37e87b119122045e176ca9d44ff00b08b
        with:
          args: detect --source . --redact --no-banner

  # The drive CLI and its mount proofs (docs/build-spec.md step 1, drive#868).
  go:
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.go == 'true' ||
       needs.changes.outputs.go_extra == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20 # go took 8 min under load on our own runners (2026-10-04), so keep headroom on hosted runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No agent attribution in the PR's commits or body
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          log=$(git log --format=%B "$BASE_SHA..$HEAD_SHA")
          ! printf '%s\n%s\n' "$log" "$PR_BODY" | grep -iEn '^(co-authored-by|claude-session):|^[^[:alpha:]]*generated with'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0  # zizmor: ignore[cache-poisoning]
        with:
          go-version: "1.24"
          cache: true
      - name: Cache the rclone release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0  # zizmor: ignore[cache-poisoning]
        with:
          path: ${{ runner.temp }}/rclone-dl
          key: rclone-${{ env.PINNED_RCLONE_VERSION }}-linux-amd64-${{ env.PINNED_RCLONE_LINUX_AMD64_SHA256 }}
      - name: Install rclone (the stock tool the mount drives)
        run: |
          zip="rclone-$PINNED_RCLONE_VERSION-linux-amd64.zip"
          mkdir -p "$RUNNER_TEMP/rclone-dl"
          cd "$RUNNER_TEMP/rclone-dl"
          test -f "$zip" || curl -fsSO "https://downloads.rclone.org/$PINNED_RCLONE_VERSION/$zip"
          echo "$PINNED_RCLONE_LINUX_AMD64_SHA256  $zip" | sha256sum -c -
          unzip -qo "$zip"
          install -D -m 0755 "rclone-$PINNED_RCLONE_VERSION-linux-amd64/rclone" "$RUNNER_TEMP/bin/rclone"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/rclone" version
      - name: No helper scripts
        run: test -z "$(git ls-files scripts bin tools ops '*.sh')"
      - name: Go code is gofmt-formatted
        run: |
          unformatted="$(gofmt -l cmd)"
          if [ -n "$unformatted" ]; then
            echo "gofmt -w these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./cmd/...
      - name: staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "2025.1.1"
          install-go: false
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.18.2"
          args: check
      - run: go build -o "$RUNNER_TEMP/drive" ./cmd/drive
      - name: Windows code vets and its tests compile
        env:
          GOOS: windows
        run: |
          go vet ./cmd/...
          go test -c -o /dev/null ./cmd/drive/
      - name: Unit tests, with the race detector
        run: go test -race ./cmd/drive/ -short -v
      - name: Stand-in mount proof
        run: go test ./cmd/drive/ -run TestStandinMountProof -v -timeout 300s
      - name: Two-device conflict proof, then no fixture outlives its run
        run: go test ./cmd/drive/ -run TestTwoDevicesKeepBothSaves -v -timeout 300s && node --test test/leftover-fixtures.test.mjs

  # Private infrastructure detail stays out of this public repo (fleet-ops#9528).
  private-detail-scan:
    name: Private detail scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned gitleaks binary
        if: github.event_name == 'pull_request' && vars.PRIVATE_DETAIL_SCAN != 'off'
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP:?}/gitleaks"
          mkdir -p -- "$install_dir"
          archive="$install_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --max-time 180 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$install_dir" gitleaks
          rm -f -- "$archive"
          chmod +x -- "$install_dir/gitleaks"
          test "$("$install_dir/gitleaks" version)" = "$GITLEAKS_VERSION"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Scan the commits this pull request adds
        if: github.event_name == 'pull_request' && vars.PRIVATE_DETAIL_SCAN != 'off'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gitleaks git . --config .github/gitleaks-private-detail.toml \
            --log-opts "${PR_BASE_SHA}..${PR_HEAD_SHA}" \
            --redact --exit-code 2 --verbose --no-banner
