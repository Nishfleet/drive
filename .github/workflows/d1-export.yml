# A weekly SQL dump of both D1 databases, kept off Cloudflare (drive#520).
#
# Time Travel covers the last 30 days, and the deploy records a restore-point
# bookmark only when a migration runs (deploy-production.yml). The weekly dump
# is the copy that survives everything else: a wrong restore, a deleted
# database, an account problem — it lands as an encrypted GitHub artifact on
# GitHub's storage, off the storage provider's and Cloudflare's accounts.
#
# The dumps are sealed with age before upload: anyone with read access to a
# private repository can download its workflow artifacts, so only ciphertext
# ships. The recipient is the repo variable AGE_RECIPIENT — the backup key's
# PUBLIC half, never a secret (docs/runbook.md, "The weekly backup") — and a
# run without it fails loud: a backup that quietly shipped plaintext, or
# quietly shipped nothing, is exactly the invisibility drive#520 exists to
# end. The age release itself is digest-pinned (docs/security.md).
#
# The waitlist dump goes through the stock D1 export API
# (`output_format: "polling"`, Cloudflare's OpenAPI schema): the first call
# starts the dump, later calls poll with the returned `at_bookmark` until
# `status: "complete"` carries a `signed_url`, valid one hour. The pinned
# `cf` CLI has no d1 export command, so this is the stock REST call, not
# hand-rolled backup logic.
#
# The drive database cannot ride that API: the export refuses a database that
# holds virtual tables (FTS5 — Cloudflare's documented limitation, "Export is
# not supported for virtual tables"), the FTS index on `file_index` is live
# production schema (migration 0039), and Cloudflare's own workaround — drop
# and recreate the virtual tables around each export — would stop search
# writes for the width of a dump and is not a real fix. Its backup is
# therefore a SQL dump through the stock query API (SELECT per table, paged
# by rowid), written below into `$RUNNER_TEMP/d1-dump.cjs` and run, never a
# check-out file; the FTS objects and their shadow tables are left out and a
# restore replays `migrations/drive/0039_file_index_fts.sql` to rebuild them
# (docs/runbook.md, "The weekly backup"). A table added later is backed up
# without a change here, and the dump fails loud rather than shipping a
# partial one.
#
# Secrets stay behind `environment: production` (drive#507; enforced by
# test/workflow-secrets.test.mjs). Retention 90 days keeps 13 weekly points.
name: D1 weekly backup

on:
  schedule:
    # Mondays 05:37 UTC, between the Worker's nightly trips (reconcile 04:00,
    # trash purge 05:00) and the week's start.
    - cron: "37 5 * * 1"
  workflow_dispatch: {} # a manual run for restore drills

concurrency:
  group: d1-export
  cancel-in-progress: false # a backup never kills a backup

permissions:
  contents: read

jobs:
  export:
    name: export
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install age, pinned by digest (docs/security.md)
        env:
          AGE_VERSION: v1.3.2
          AGE_LINUX_AMD64_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          node -e 'const fs=require("fs");const [,url,out]=process.argv;(async()=>{const r=await fetch(url);if(!r.ok){console.error("download: HTTP "+r.status);process.exit(1);}fs.writeFileSync(out,Buffer.from(await r.arrayBuffer()));})()' "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz" "$RUNNER_TEMP/age.tar.gz"
          echo "$AGE_LINUX_AMD64_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/age-bin"
          tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP/age-bin" --strip-components=1 age/age
          test -x "$RUNNER_TEMP/age-bin/age"
      - name: Export both databases
        run: |
          test -n "$AGE_RECIPIENT" || { echo "::error::the age recipient is unset: set the repo variable AGE_RECIPIENT to the backup key's public key (docs/runbook.md, The weekly backup) — the backup refuses to ship plaintext dumps"; exit 1; }
          mkdir -p "$RUNNER_TEMP/d1-export"
          stamp=$(date -u +%Y%m%d)
          headers="$RUNNER_TEMP/d1-headers"
          trap 'rm -f "$headers"' EXIT
          (umask 077 && printf 'Authorization: Bearer %s\n' "$CLOUDFLARE_API_TOKEN" > "$headers")
          cat > "$RUNNER_TEMP/d1-dump.cjs" <<'DUMP'
          const { writeFileSync } = require("fs");
          const NAME = process.env.BACKUP_NAME ?? "";
          const DB = process.env.BACKUP_DB ?? "";
          const OUT = process.env.BACKUP_OUT ?? "";
          const ACCT = process.env.CLOUDFLARE_ACCOUNT_ID ?? "";
          const TOKEN = process.env.CLOUDFLARE_API_TOKEN ?? "";
          const PAGE = 500;
          // 2,048,000 rows per table before the dump quits: past the width
          // of one window it must fail loud, not drift on.
          const MAX_PAGES = 4096;
          const api = (sql, params) =>
            fetch(`https://api.cloudflare.com/client/v4/accounts/${ACCT}/d1/database/${DB}/query`, {
              method: "POST",
              headers: { "content-type": "application/json", authorization: `Bearer ${TOKEN}` },
              body: JSON.stringify({ sql, params }),
            }).then(async (r) => {
              // The response body carries the API's own error text, never
              // anything we sent, so it is safe to surface verbatim.
              const body = await r.text();
              if (!r.ok) throw new Error(`query: HTTP ${r.status}: ${body.slice(0, 400)}`);
              let j;
              try {
                j = JSON.parse(body);
              } catch {
                throw new Error(`query: the answer is not JSON: ${body.slice(0, 400)}`);
              }
              if (j.success !== true) throw new Error("query: " + (j.errors?.[0]?.message ?? "not success"));
              const res = (j.result ?? [])[0] ?? {};
              if (res.success === false) throw new Error(res.error ?? "query failed");
              return res.results ?? [];
            });
          const query = (sql, params) => {
            const attempt = async (n) => {
              try {
                return await api(sql, params);
              } catch (e) {
                if (n >= 3) throw e;
                console.error(`retrying after: ${e.message}`);
                await new Promise((r) => setTimeout(r, 5000));
                return attempt(n + 1);
              }
            };
            return attempt(1);
          };
          const idq = (n) => '"' + String(n).replace(/"/g, '""') + '"';
          const literal = (v) => {
            if (v === null) return "NULL";
            if (typeof v === "number") return String(v);
            if (typeof v === "boolean") return String(Number(v));
            if (Array.isArray(v)) return `X'${Buffer.from(v).toString("hex")}'`;
            return `'` + String(v).replaceAll(`'`, `''`) + `'`;
          };
          (async () => {
            if (!NAME || !DB || !OUT) throw new Error("the dump is not wired: BACKUP_NAME, BACKUP_DB and BACKUP_OUT are all required");
            if (!ACCT || !TOKEN) throw new Error("the account or the token is missing from the environment");
            const objects = await query("SELECT type, name, tbl_name, sql FROM sqlite_master WHERE type IN ('table','index','trigger') AND name NOT LIKE 'sqlite_%'");
            // FTS5's internal tables and triggers carry the virtual table's
            // name as a prefix (file_index_fts_data, file_index_fts_ai). The
            // dump carries only the real tables and the indexes and triggers
            // that belong to them; migration 0039 rebuilds the rest on a
            // restore.
            const virtual = objects.filter((o) => o.type === "table" && String(o.sql ?? "").toUpperCase().startsWith("CREATE VIRTUAL TABLE")).map((o) => o.name);
            const shadow = (n) => virtual.some((v) => n === v || n.startsWith(v + "_"));
            const tables = objects.filter((o) => o.type === "table" && !shadow(o.name) && o.sql);
            const others = objects.filter((o) => o.type !== "table" && o.sql !== null && !shadow(o.name) && !shadow(o.tbl_name));
            if (tables.length === 0) throw new Error("the schema has no real tables to back up — refusing to ship an empty dump");
            const parts = ["PRAGMA foreign_keys=OFF;"];
            for (const t of tables) parts.push(t.sql + ";");
            let total = 0;
            for (const t of tables) {
              const tn = idq(t.name);
              let after = 0;
              let pages = 0;
              let count = 0;
              for (;;) {
                // rowid exists on every ordinary table here (none is WITHOUT
                // ROWID); the keyset on it keeps one SELECT per page steady
                // while rows change under the dump.
                const rows = await query(`SELECT rowid AS __backup_rid, * FROM ${tn} WHERE rowid > ? ORDER BY rowid LIMIT ${PAGE}`, [after]);
                for (const row of rows) {
                  const { __backup_rid, ...cols } = row;
                  const names = Object.keys(cols).map(idq).join(", ");
                  const values = Object.keys(cols).map((k) => literal(cols[k])).join(", ");
                  parts.push(`INSERT INTO ${tn} (${names}) VALUES (${values});`);
                }
                count += rows.length;
                if (rows.length < PAGE) break;
                after = rows[rows.length - 1].__backup_rid;
                pages += 1;
                if (pages > MAX_PAGES) throw new Error(`${t.name}: more than ${MAX_PAGES * PAGE} rows — refusing to page past the backup window`);
              }
              console.log(`${t.name}: ${count} rows`);
              total += count;
            }
            for (const o of others) parts.push(o.sql + ";");
            writeFileSync(OUT, parts.join("\n") + "\n");
            console.log(`${NAME}: ${total} rows from ${tables.length} tables (+${others.length} indexes and triggers) -> ${OUT}`);
          })().catch((e) => {
            console.error("dump: " + e.message);
            process.exit(1);
          });
          DUMP
          for pair in "waitlist 93c9f523-159c-4261-8541-d4c059906df3 export" "drive 0f636b57-4a2e-482a-bf40-8aa315e2403e dump"; do
            read -r name db mode <<<"$pair"
            file="$RUNNER_TEMP/d1-export/$name-$stamp.sql"
            if [ "$mode" = dump ]; then
              BACKUP_NAME="$name" BACKUP_DB="$db" BACKUP_OUT="$file" node "$RUNNER_TEMP/d1-dump.cjs" \
                || { echo "::error::$name backup: the SQL dump failed"; exit 1; }
            else
              bookmark=""
              url=""
              for attempt in $(seq 1 20); do
                echo "poll $attempt for $name"
                if [ -n "$bookmark" ]; then
                  body="{\"output_format\":\"polling\",\"current_bookmark\":\"$bookmark\"}"
                else
                  body='{"output_format":"polling"}'
                fi
                resp=$(curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors \
                  -H "@$headers" -H 'content-type: application/json' -d "$body" \
                  "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$db/export") \
                  || { echo "::error::$name export: the API call failed"; exit 1; }
                state=$(printf '%s' "$resp" | node -e '
                  const r = JSON.parse(require("fs").readFileSync(0, "utf8"));
                  if (r.success !== true) { console.error("api: " + (r.errors?.[0]?.message ?? "not success")); process.exit(1); }
                  const t = r.result ?? {};
                  if (t.status === "error") { console.error("export: " + (t.error ?? "failed")); process.exit(1); }
                  if (t.status === "complete") { process.stdout.write("done " + (t.result?.signed_url ?? "")); }
                  else { process.stdout.write("wait " + (t.at_bookmark ?? "")); }
                ') || { echo "::error::$name export: the API answer is not a valid export response"; exit 1; }
                case "$state" in
                  done\ *) url="${state#done }"; break ;;
                  wait\ *) bookmark="${state#wait }" ;;
                  *) echo "::error::$name export: unreadable poll state"; exit 1 ;;
                esac
                sleep 15
              done
              test -n "$url" || { echo "::error::$name export: no download URL after 20 polls"; exit 1; }
              # The signed URL's dump is data, not code: it is written to
              # $RUNNER_TEMP and shipped as an artifact, never executed, and it
              # changes every run so no digest can be pinned. The runtime's own
              # fetch (TLS, no shell quoting) takes it instead of curl, which
              # test/workflow-downloads.test.mjs would read as an unpinned
              # executable download (drive#581's gate is about assets that run).
              node -e 'const fs=require("fs");(async()=>{const r=await fetch(process.argv[1]);if(!r.ok){console.error("download: HTTP "+r.status);process.exit(1);}fs.writeFileSync(process.argv[2],Buffer.from(await r.arrayBuffer()));})()' "$url" "$file" \
                || { echo "::error::$name export: the dump download failed"; exit 1; }
            fi
            echo "exported $name -> $name-$stamp.sql ($(wc -c < "$file") bytes, sha256 $(sha256sum "$file" | cut -d' ' -f1))"
            # Sealed before anything ships: only the .age ciphertext reaches
            # the artifact, and the plaintext dies with the runner's temp.
            "$RUNNER_TEMP/age-bin/age" -r "$AGE_RECIPIENT" -o "$file.age" "$file" \
              || { echo "::error::$name export: the age encryption failed"; exit 1; }
            rm -f "$file"
          done
          rm -f "$RUNNER_TEMP/d1-dump.cjs"
          sha256sum "$RUNNER_TEMP/d1-export/"*.sql.age
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
      - name: Upload the sealed dumps off Cloudflare
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d1-backup
          path: ${{ runner.temp }}/d1-export/*.sql.age
          retention-days: 90
          if-no-files-found: error
